<!doctype html><html><head><title>Lung ART</title></head><body><main><h1>Lung ART</h1><p>Postoperative radiotherapy after complete resection of pN2 NSCLC.</p><p>501 patients. Three-year DFS 47% vs 44%; HR 0.86 (95% CI 0.68–1.08; P=0.18). PORT did not demonstrate statistically significant DFS superiority. Late grade 3–4 cardiopulmonary toxicity 11% vs 5%.</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/?term=Lung+ART+trial+postoperative+radiotherapy">Primary report</a></p></main></body></html>
