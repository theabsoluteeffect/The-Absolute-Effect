name: Repair Trial of the Day Now
on:
  push:
    paths:
      - 'TRIAL_OF_DAY_REPAIR_TRIGGER'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair front-page Trial of the Day and daily rotator
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          index_path=root/'index.html'
          current_path=root/'data/trial-of-the-day.json'
          script_path=root/'scripts/update_daily_atlas.py'
          index=index_path.read_text(encoding='utf-8')
          current=json.loads(current_path.read_text(encoding='utf-8'))
          html=f'''<!-- TRIAL_OF_THE_DAY_START -->
          <section id="trial-of-the-day" class="trial-day">
          <div class="card">
          <div class="eyebrow">Trial of the Day · {current['date']}</div>
          <h2 class="trial-day-title">{current['trial']}: {current['title']}</h2>
          <div class="trial-day-meta">{current['journal']} · {current['setting']} · {current['population']}</div>
          <div class="trial-day-grid"><div><p><strong>What did it show?</strong> {current['summary']}</p></div><div><div class="review"><strong>Critical clinical review</strong><br>{current['criticalReview']}</div><p><a class="trial-link" href="{current['url']}" target="_blank" rel="noopener">Read the primary publication →</a></p></div></div>
          </div>
          </section>
          <!-- TRIAL_OF_THE_DAY_END -->'''
          pattern=r'<!-- TRIAL_OF_THE_DAY_START -->.*?<!-- TRIAL_OF_THE_DAY_END -->'
          if re.search(pattern,index,re.S):
              index=re.sub(pattern,html,index,count=1,flags=re.S)
          else:
              old=r'<section class="trial-day">.*?</section>'
              if re.search(old,index,re.S): index=re.sub(old,html,index,count=1,flags=re.S)
              else: index=index.replace('<main>','<main>\n'+html,1)
          index_path.write_text(index,encoding='utf-8')
          script=script_path.read_text(encoding='utf-8')
          old="""start = \"<!-- TRIAL_OF_THE_DAY_START -->\"\nend = \"<!-- TRIAL_OF_THE_DAY_END -->\"\nif start not in index or end not in index:\n    raise SystemExit(\"Trial of the Day markers not found\")"""
          new="""start = \"<!-- TRIAL_OF_THE_DAY_START -->\"\nend = \"<!-- TRIAL_OF_THE_DAY_END -->\"\nif start not in index or end not in index:\n    legacy = re.search(r'<section class=\"trial-day\">.*?</section>', index, re.S)\n    if legacy:\n        legacy_html = legacy.group(0)\n        index = index[:legacy.start()] + start + legacy_html + end + index[legacy.end():]\n    else:\n        raise SystemExit(\"Trial of the Day markers not found\")"""
          if old in script:
              script=script.replace(old,new,1)
              script=script.replace('import json\nfrom pathlib import Path\nfrom html import escape','import json\nimport re\nfrom pathlib import Path\nfrom html import escape',1)
              script_path.write_text(script,encoding='utf-8')
          print('Trial of the Day repaired:', current['trial'])
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/update_daily_atlas.py
          git diff --cached --quiet || git commit -m 'Repair and rotate Trial of the Day'
          git push
