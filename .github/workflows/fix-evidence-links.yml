name: Fix evidence links

on:
  push:
    paths:
      - '.github/workflows/fix-evidence-links.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generic evidence links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='href=\\"trial-pages/${t.path}/\\"'
          new='href=\\"${t.path&&t.path.startsWith(\'__evidence__/\')?\'evidence.html?id=\'+encodeURIComponent(t.path.slice(\'__evidence__/\'.length)):\'trial-pages/\'+t.path+\'/\'}\\"'
          if old not in s:
              raise SystemExit('Expected evidence link pattern not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-evidence-links.yml
          git commit -m 'Fix links for generic evidence entries'
          git push
