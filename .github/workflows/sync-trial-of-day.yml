name: Sync Trial of the Day
on:
  push:
    paths:
      - 'SYNC_TRIAL_OF_DAY_TRIGGER'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync homepage Trial of the Day
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          index_path=root/'index.html'
          current=json.loads((root/'data/trial-of-the-day.json').read_text(encoding='utf-8'))
          index=index_path.read_text(encoding='utf-8')
          start='<!-- TRIAL_OF_THE_DAY_START -->'
          end='<!-- TRIAL_OF_THE_DAY_END -->'
          html=f'''<!-- TRIAL_OF_THE_DAY_START -->
          <section id="trial-of-the-day" class="trial-day">
          <div class="card">
          <div class="eyebrow">Trial of the Day · {current['date']}</div>
          <h2 class="trial-day-title">{current['trial']}: {current['title']}</h2>
          <div class="trial-day-meta">{current['journal']} · {current['setting']} · {current['population']}</div>
          <div class="trial-day-grid"><div><p><strong>What did it show?</strong> {current['summary']}</p></div><div><div class="review"><strong>Critical clinical review</strong><br>{current['criticalReview']}</div><p><a class="trial-link" href="{current['url']}" target="_blank" rel="noopener">Read the primary publication →</a></p></div></div>
          </div>
          </section>
          <!-- TRIAL_OF_THE_DAY_END -->'''
          pattern=re.escape(start)+r'.*?'+re.escape(end)
          if not re.search(pattern,index,re.S):
              raise SystemExit('Trial of the Day markers not found')
          index=re.sub(pattern,html,index,count=1,flags=re.S)
          index_path.write_text(index,encoding='utf-8')
          print('Synced Trial of the Day:',current['trial'],current['date'])
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Sync current Trial of the Day'
          git push
