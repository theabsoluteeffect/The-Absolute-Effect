name: Clarify SENOMAC non-inferiority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-senomac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update SENOMAC wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          old='''"id": "senomac",'''
          i=h.find(old)
          if i < 0: raise SystemExit('SENOMAC not found')
          j=h.find('  },', i)
          if j < 0: raise SystemExit('SENOMAC object end not found')
          block=h[i:j]
          replacements={
            '"relativeLabel": "HR",':'"relativeLabel": "NON-INFERIOR; HR",',
            '"benefitText": "5-year recurrence-free survival 89.7% vs 88.7%: +1.0 percentage point.",':'"benefitText": "NON-INFERIOR. 5-year recurrence-free survival 89.7% vs 88.7%: +1.0 percentage point; HR 0.89 (95% CI 0.66–1.19), below the prespecified non-inferiority margin of 1.44 (P<0.001).",',
            '"harmLabel": "Axillary recurrence was very uncommon; avoiding ALND reduces surgical morbidity.",':'"harmLabel": "Most patients received nodal radiation; avoiding ALND reduces surgical morbidity.",',
          }
          for a,b in replacements.items():
            if a not in block: raise SystemExit(f'Missing expected SENOMAC text: {a}')
            block=block.replace(a,b)
          h=h[:i]+block+h[j:]
          p.write_text(h,encoding='utf-8')
          PY
          node --check <(sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clarify SENOMAC non-inferiority result' || echo 'No changes'
          git push
