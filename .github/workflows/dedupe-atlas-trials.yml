name: Dedupe atlas trial entries

on:
  push:
    paths:
      - '.github/workflows/dedupe-atlas-trials.yml'

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate trial cards
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          let html=fs.readFileSync('index.html','utf8');
          const m=html.match(/const trials=(\[.*?\]);\nconst DISCIPLINES/s);
          if(!m) throw new Error('Could not locate trials array');
          const existing=vm.runInNewContext('('+m[1]+')');
          const seen=new Set(),dedup=[];
          for(const x of existing){const k=(x.site+'|'+x.trial).toLowerCase();if(!seen.has(k)){seen.add(k);dedup.push(x);}}
          html=html.slice(0,m.index+m[0].indexOf(m[1]))+JSON.stringify(dedup)+html.slice(m.index+m[0].indexOf(m[1])+m[1].length);
          fs.writeFileSync('index.html',html);
          console.log('Trial entries before:',existing.length,'after:',dedup.length);
          NODE
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/dedupe-atlas-trials.yml
          git commit -m 'Remove duplicate trial entries from atlas'
          git push
