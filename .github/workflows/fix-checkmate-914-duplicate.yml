name: Fix CheckMate 914 duplicate

on:
  push:
    paths:
      - '.github/workflows/fix-checkmate-914-duplicate.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate CheckMate 914 entry
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          let html=fs.readFileSync('index.html','utf8');
          const m=html.match(/const trials=(\[.*?\]);\nconst DISCIPLINES/s);
          if(!m) throw new Error('Could not locate trials array');
          const existing=vm.runInNewContext('('+m[1]+')');
          let seen914=false;
          const dedup=existing.filter(x=>{
            if(x.path==='__evidence__/checkmate-914'){
              if(seen914) return false;
              seen914=true;
            }
            return true;
          });
          html=html.slice(0,m.index+m[0].indexOf(m[1]))+JSON.stringify(dedup)+html.slice(m.index+m[0].indexOf(m[1])+m[1].length);
          fs.writeFileSync('index.html',html);
          console.log('CheckMate 914 entries before:',existing.filter(x=>x.path==='__evidence__/checkmate-914').length,'after:',dedup.filter(x=>x.path==='__evidence__/checkmate-914').length);
          NODE
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-checkmate-914-duplicate.yml
          git commit -m 'Remove duplicate CheckMate 914 entry'
          git push
