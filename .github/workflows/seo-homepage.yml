name: SEO homepage enhancement
on:
  push:
    paths:
      - SEO_HOME_TRIGGER
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance homepage SEO
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>The Absolute Effect | Oncology Evidence Atlas</title>','<title>Oncology Evidence Atlas | Absolute Benefit, NNT &amp; NNH | The Absolute Effect</title>')
          s=s.replace('<meta name="description" content="Clinician-facing oncology evidence atlas translating clinical-trial results into absolute benefit, harm, NNT, NNH and patient-level interpretation.">','<meta name="description" content="The Absolute Effect is an oncology evidence atlas translating clinical-trial results into absolute treatment benefit, harm, NNT, NNH and patient-level interpretation.">')
          marker='<a class="btn" href="#explore">Explore the evidence ↓</a>'
          link=marker+'<p style="margin-top:16px"><a href="oncology-evidence/">Browse oncology evidence by cancer type →</a></p>'
          s=s.replace(marker,link,1)
          old='</script></head><body>'
          extra='</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Dr Rishi P Nair","jobTitle":"Clinical Oncologist","worksFor":{"@type":"Organization","name":"The Absolute Effect"},"url":"https://theabsoluteeffect.pages.dev/"}</script></head><body>'
          s=s.replace(old,extra,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve homepage SEO metadata and internal linking"
          git push
