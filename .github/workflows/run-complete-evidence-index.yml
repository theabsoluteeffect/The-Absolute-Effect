name: Run complete evidence index

on:
  push:
    paths:
      - '.github/workflows/run-complete-evidence-index.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge all full evidence into atlas dropdown
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, urllib.request
          root=Path('.')
          html_path=root/'index.html'
          html=html_path.read_text(encoding='utf-8')
          m=re.search(r'const trials=(\[.*?\]);\nconst DISCIPLINES',html,re.S)
          if not m: raise SystemExit('Could not locate trials array')
          existing=json.loads(m.group(1).replace("'",'"'))
          by_trial={x['trial'].lower():x for x in existing}
          dedicated={'javelin bladder 100':'javelin-bladder-100','sorce':'sorce','assure':'assure','everest':'everest','eortc 30986':'eortc-30986','mrc/eortc bep vs ceb':'mrc-eortc-bep-vs-ceb','getug-afu 16':'getug-afu-16','nsabp b-18':'nsabp-b18','nsabp b-27':'nsabp-b27','randomized trial of adjuvant 5-fu-platinum vs paclitaxel-platinum':'penile-adjuvant-5fu-vs-paclitaxel'}
          records=[]
          for u in ['https://raw.githubusercontent.com/theabsoluteeffect/The-Absolute-Effect/main/data/daily-evidence-2026-09-06.json','https://raw.githubusercontent.com/theabsoluteeffect/The-Absolute-Effect/main/data/daily-evidence-2026-09-06-batch2.json']:
              with urllib.request.urlopen(u) as r: records += json.loads(r.read().decode())
          seen=set(); full=[]
          for x in records:
              k=str(x.get('id') or x.get('trial') or '').strip().lower()
              if k and k not in seen: seen.add(k); full.append(x)
          merged=list(existing)
          keys={(x['site'].lower(),x['discipline'].lower(),x['setting'].lower(),x['trial'].lower()) for x in merged}
          viewer={}
          for x in full:
              site=x.get('site','').strip(); disc=x.get('discipline','').strip(); setting=x.get('setting','').strip(); trial=x.get('trial','').strip(); question=x.get('clinicalQuestion','').strip()
              if disc.lower()=='uro-oncology': disc='Surgical Oncology'
              key=(site.lower(),disc.lower(),setting.lower(),trial.lower())
              vid=x.get('id') or re.sub(r'[^a-z0-9]+','-',trial.lower()).strip('-')
              viewer[vid]=dict(x,discipline=disc)
              path=dedicated.get(trial.lower()) or by_trial.get(trial.lower(),{}).get('path')
              if key not in keys:
                  merged.append({'site':site,'discipline':disc,'setting':setting,'trial':trial,'question':question,'path':path or '__evidence__/'+vid})
                  keys.add(key)
          html=html[:m.start(1)]+json.dumps(merged,ensure_ascii=False,separators=(',',':'))+html[m.end(1):]
          if 'function hrefFor(t)' not in html:
              html=html.replace('function render(){const matches=matching();',"function hrefFor(t){return t.path&&t.path.startsWith('__evidence__/')?'evidence.html?id='+encodeURIComponent(t.path.slice('__evidence__/'.length)):'trial-pages/'+t.path+'/'}\nfunction render(){const matches=matching();")
          html=html.replace('href="trial-pages/${t.path}/"','href="${hrefFor(t)}"')
          html_path.write_text(html,encoding='utf-8')
          data=json.dumps(viewer,ensure_ascii=False,separators=(',',':'))
          page='''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Entry | The Absolute Effect</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f7f7f5;color:#171717;line-height:1.55}main{max-width:900px;margin:auto;padding:36px 20px}.card{background:#fff;border:1px solid #e3e3df;border-radius:16px;padding:24px;margin:18px 0}.eyebrow,.label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.effect{font-size:30px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="./">← Back to The Absolute Effect</a><div id="app"></div><script>const DATA=__DATA__;const id=new URLSearchParams(location.search).get('id'),x=DATA[id],app=document.getElementById('app');if(!x){app.innerHTML='<div class="card"><h1>Evidence entry not found</h1></div>'}else{app.innerHTML=`<p class="eyebrow">${x.site} · ${x.discipline} · ${x.setting}</p><h1>${x.trial}</h1><p>${x.clinicalQuestion||''}</p><div class="card"><h2>What was studied?</h2><p><b>Population:</b> ${x.population||'Not reported'}</p><p><b>Treatment:</b> ${x.treatment||'Not reported'}</p><p><b>Endpoint:</b> ${x.endpoint||'Not reported'}</p><p><b>Horizon:</b> ${x.horizon||'Not reported'}</p></div><div class="card"><h2>Absolute Effect</h2><div class="grid"><div><div class="label">Absolute benefit</div><div class="effect">${x.absoluteBenefit!==undefined?x.absoluteBenefit:'Not reported'}</div></div><div><div class="label">NNT</div><div class="effect">${x.nnt||'Not applicable'}</div></div></div><p>${x.benefitText||''}</p></div><div class="card"><h2>Relative Effect</h2><p><b>${x.relativeLabel||'Effect'}:</b> ${x.relativeEffect||'Not reported'}</p><p><b>Statistics:</b> ${x.ci||'Not reported'}</p></div><div class="card"><h2>Harm</h2><p><b>${x.harmLabel||'Treatment-related harm'}:</b> ${x.harmIncrease!==undefined?x.harmIncrease+' percentage points':'Not reported'}</p><p><b>NNH:</b> ${x.nnH||'Not applicable'}</p></div><div class="card"><h2>References</h2><ul>${(x.refs||[]).map(r=>'<li>'+r+'</li>').join('')}</ul><p>${(x.urls||[]).map(u=>'<a href="'+u+'" target="_blank">Primary publication / source →</a>').join('<br>')}</p></div>`}</script></main></body></html>'''.replace('__DATA__',data)
          (root/'evidence.html').write_text(page,encoding='utf-8')
          PY
      - name: Commit and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html evidence.html
          git rm .github/workflows/run-complete-evidence-index.yml .github/workflows/repair-complete-evidence-index.yml || true
          git commit -m 'Integrate all indexed evidence into atlas dropdown' || exit 0
          git push
