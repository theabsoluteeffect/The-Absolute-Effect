name: Add missing ten evidence trials v2
on:
  push:
    paths:
      - '.github/workflows/add-missing-ten-v2.yml'
  workflow_dispatch:
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrate ten trials
        run: |
          python - <<'PY'
          import ast,json,pathlib,re
          wf=pathlib.Path('.github/workflows/add-missing-ten.yml').read_text()
          m=re.search(r'records=\[(.*?)\]\n          p=',wf,re.S)
          if not m: raise SystemExit('Could not extract trial records from prior workflow')
          records=ast.literal_eval('['+m.group(1)+']')
          pathlib.Path('data/daily-evidence-2026-09-09-batch3.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          def replace_js_object(text,prefix,records_obj):
            start=text.index(prefix)+len(prefix)
            depth=0; quote=None; esc=False
            for i in range(start,len(text)):
              c=text[i]
              if quote:
                if esc: esc=False
                elif c=='\\': esc=True
                elif c==quote: quote=None
                continue
              if c in "'\"": quote=c; continue
              if c in '([{': depth+=1
              elif c in ')]}':
                depth-=1
                if depth==0:
                  return text[:start]+json.dumps(records_obj,ensure_ascii=False,separators=(',',':'))+text[i+1:]
            raise ValueError('Unclosed JS structure')
          ep=pathlib.Path('evidence.html'); s=ep.read_text(); start=s.index('const DATA=')+len('const DATA=')
          # extract DATA object with brace matching
          depth=0; quote=None; esc=False; end=None
          for i in range(start,len(s)):
            c=s[i]
            if quote:
              if esc: esc=False
              elif c=='\\': esc=True
              elif c==quote: quote=None
              continue
            if c in "'\"": quote=c; continue
            if c=='{': depth+=1
            elif c=='}':
              depth-=1
              if depth==0: end=i+1; break
          data=json.loads(s[start:end])
          for r in records: data[r['id']]=r
          s=s[:start]+json.dumps(data,ensure_ascii=False,separators=(',',':'))+s[end:]
          ep.write_text(s)
          ip=pathlib.Path('index.html'); s=ip.read_text(); start=s.index('const trials=')+len('const trials=')
          depth=0; quote=None; esc=False; end=None
          for i in range(start,len(s)):
            c=s[i]
            if quote:
              if esc: esc=False
              elif c=='\\': esc=True
              elif c==quote: quote=None
              continue
            if c in "'\"": quote=c; continue
            if c=='[': depth+=1
            elif c==']':
              depth-=1
              if depth==0: end=i+1; break
          trials=json.loads(s[start:end]); existing={x.get('trial') for x in trials}
          for r in records:
            if r['trial'] not in existing:
              trials.append({'site':r['site'],'discipline':r['discipline'],'setting':r['setting'],'trial':r['trial'],'question':r['clinicalQuestion'],'path':'__evidence__/'+r['id']})
          s=s[:start]+json.dumps(trials,ensure_ascii=False,separators=(',',':'))+s[end:]
          ip.write_text(s)
          wanted={r['trial'] for r in records}
          assert wanted <= {x['trial'] for x in trials}
          assert wanted <= {x['trial'] for x in data.values()}
          assert len(trials)==len({x['trial'] for x in trials})
          print('Integrated',len(records),'records; index now has',len(trials),'unique trials.')
          PY
      - name: Commit and remove one-time workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily-evidence-2026-09-09-batch3.json evidence.html index.html
          git commit -m 'Add ten missing evidence trials to atlas'
          git rm .github/workflows/add-missing-ten.yml .github/workflows/add-missing-ten-v2.yml
          git commit -m 'Remove one-time evidence integration workflows'
          git push
