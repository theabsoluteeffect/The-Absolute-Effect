name: Outcome visualization audit
on:
  push:
    branches: [main]
    paths:
      - 'trial-pages/**'
      - 'assets/absolute-effect.js'
      - 'assets/trial-page-template.js'
      - 'data/master-trial-roster.json'
      - 'scripts/audit-outcome-visuals.js'
      - '.github/workflows/outcome-visual-audit.yml'
  pull_request:
    paths:
      - 'trial-pages/**'
      - 'assets/absolute-effect.js'
      - 'assets/trial-page-template.js'
      - 'data/master-trial-roster.json'
      - 'scripts/audit-outcome-visuals.js'
      - '.github/workflows/outcome-visual-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit all roster and trial HTML pages
        run: node scripts/audit-outcome-visuals.js
      - name: Upload visual audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outcome-visual-audit
          path: data/outcome-visual-audit.json
