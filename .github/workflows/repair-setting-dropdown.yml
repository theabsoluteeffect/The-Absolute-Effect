name: Repair setting dropdown once

on:
  push:
    paths:
      - '.github/workflows/repair-setting-dropdown.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair setting dropdown behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function updateAfterDiscipline(){g.value='';q.value='';const settings=trials.filter(t=>t.site===s.value&&t.discipline===d.value).map(t=>t.setting);fillSelect(g,'Select setting',settings,settings.length===0);resetSelect(q,'Select clinical question',true);render()}"
          new = "function updateAfterDiscipline(){g.value='';q.value='';const settings=trials.filter(t=>t.site===s.value&&t.discipline===d.value).map(t=>t.setting);if(settings.length){fillSelect(g,'Select setting',settings,false)}else{resetSelect(g,'No settings currently indexed for this discipline',false)}resetSelect(q,'Select clinical question',true);render()}"
          if old not in s:
              raise SystemExit('Expected setting-dropdown function not found; refusing to modify the file.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time repair workflow and commit
        run: |
          rm .github/workflows/repair-setting-dropdown.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/repair-setting-dropdown.yml
          git commit -m 'Fix empty setting dropdown for disciplines without indexed evidence'
          git push
