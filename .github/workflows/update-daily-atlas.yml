name: Update Daily Oncology Atlas
on: push
permissions:
  contents: write
jobs:
  update-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate daily evidence and rotate Trial of the Day
        run: python scripts/update_daily_atlas.py
      - name: Merge all daily evidence and enforce atlas rules
        run: python scripts/merge_all_daily_evidence.py
      - name: Repair tumour site filter state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'siteEl.onchange=()=>{ renderFilters(false); renderQuestionFilter(); renderEntry(); };'
          new = 'siteEl.onchange=()=>{ renderFilters(true); renderQuestionFilter(); renderEntry(); };'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Tumour site filter repair applied')
          PY
      - name: Validate atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text = Path('index.html').read_text(encoding='utf-8')
          required=['german-ah01-94','swenoteca-stage1-nsgct','mrc-te08','getug-13','mrc-te05','sakk-01-10','swog-8710','vesper','checkmate-274','imvigor010','javelin-bladder-100','checkmate-901','niagara','keynote-905','keynote-564','checkmate-914','sorce','stampee-high-risk-m0','embark','arasens']
          missing=[x for x in required if x not in text]
          assert not missing, f'Missing evidence records: {missing}'
          assert 'Uro-oncology' not in text.replace("'Uro-' + 'oncology'",'')
          assert 'Multidisciplinary' not in text
          assert 'Theranostic Trials' in text and 'Imaging' in text
          assert 'function getSettings' in text
          assert text.count('const defaultEvidence=') == 1
          assert 'function questionFor(e){const q=questionLabels[e.id]||e.clinicalQuestion||e.trial;' in text
          for p in Path('data').glob('daily-evidence-*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('Atlas validation passed: all approved batch-2 records, taxonomy and dependent filters present.')
          PY
      - name: Commit atlas changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot].noreply.github.com'
          git add index.html data/trial-archive.json data/previous-trial-of-the-day.json scripts/merge_all_daily_evidence.py .github/workflows/update-daily-atlas.yml
          if git diff --cached --quiet; then
            echo 'No atlas changes'
          else
            git commit -m 'Update daily oncology evidence atlas'
            git push
          fi
