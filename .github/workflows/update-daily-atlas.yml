name: Update Daily Oncology Atlas

on:
  push:
    branches: [main]
    paths:
      - 'data/daily-evidence-*.json'
      - 'scripts/merge_all_daily_evidence.py'
      - 'scripts/update_sitemap.py'
      - 'scripts/update_trial_page_seo.py'
      - 'index.html'
      - 'trial-pages/**'
      - 'evidence.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge all daily evidence into the atlas
        run: python scripts/merge_all_daily_evidence.py

      - name: Repair atlas taxonomy and evidence sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          # GBM is a disease entity within Neuro-Oncology, not a separate tumour-site level.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('"site":"Glioblastoma"', '"site":"Neuro-Oncology"')
          text = text.replace('"site": "Glioblastoma"', '"site": "Neuro-Oncology"')
          p.write_text(text, encoding='utf-8')

          # Keep the generic evidence viewer synchronized with every daily evidence file.
          e = Path('evidence.html')
          et = e.read_text(encoding='utf-8')
          sources = [f'data/{x.name}' for x in sorted(Path('data').glob('daily-evidence-*.json')) if x.name != 'daily-evidence-2026-09-10-seo-trigger.json']
          source_js = 'const SOURCES=' + json.dumps(sources, ensure_ascii=False, separators=(',', ':')) + ';'
          et = re.sub(r'const SOURCES=\[.*?\];', source_js, et, count=1, flags=re.S)
          e.write_text(et, encoding='utf-8')
          print(f'Normalized GBM into Neuro-Oncology and synchronized {len(sources)} evidence sources.')
          PY

      - name: Update SEO metadata and structured data on trial pages
        run: python scripts/update_trial_page_seo.py

      - name: Validate atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          assert "fetch('/data/master-trial-roster.json'" in text, 'Homepage must load the master roster dynamically'
          assert 'let trials=[];' in text
          assert 'defaultEvidence' not in text
          assert 'Uro-oncology' not in text
          assert 'Multidisciplinary' not in text
          assert '"site":"Glioblastoma"' not in text
          assert '"site": "Glioblastoma"' not in text

          files = sorted(Path('data').glob('daily-evidence-*.json'))
          total = sum(len(json.loads(p.read_text(encoding='utf-8'))) for p in files)
          roster = json.loads(Path('data/master-trial-roster.json').read_text(encoding='utf-8'))
          trials = roster.get('trials', [])
          assert trials, 'Master trial roster is empty'
          assert len({x.get('id') for x in trials}) == len(trials), 'Duplicate trial IDs in master roster'

          evidence = Path('evidence.html').read_text(encoding='utf-8')
          sm = re.search(r'const SOURCES=(\[.*?\]);', evidence, re.S)
          assert sm, 'Evidence source list missing'
          sources = json.loads(sm.group(1))
          for f in files:
              if f.name != 'daily-evidence-2026-09-10-seo-trigger.json':
                  assert f'data/{f.name}' in sources, f'Missing evidence source: {f.name}'

          pages = list(Path('trial-pages').glob('*/index.html'))
          assert pages, 'No trial pages found'
          for page in pages:
              page_text = page.read_text(encoding='utf-8')
              assert 'name="description"' in page_text, f'Missing description: {page}'
              assert 'rel="canonical"' in page_text, f'Missing canonical: {page}'
              assert 'data-seo="trial"' in page_text, f'Missing trial structured data: {page}'
          print(f'Atlas validation passed: {total} daily records; {len(trials)} unique master-roster trials; {len(pages)} SEO-ready trial pages.')
          PY

      - name: Update sitemap and robots
        run: python scripts/update_sitemap.py

      - name: Commit atlas and SEO changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html evidence.html sitemap.xml robots.txt trial-pages scripts/update_trial_page_seo.py
          if git diff --cached --quiet; then
            echo 'No atlas or SEO changes'
          else
            git commit -m 'Update daily oncology evidence atlas and SEO'
            git push
          fi
