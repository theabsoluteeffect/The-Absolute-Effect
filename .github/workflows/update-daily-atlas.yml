name: Update Daily Oncology Atlas
on: push
permissions:
  contents: write
jobs:
  update-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate daily evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('data').glob('daily-evidence-*.json'))
          assert files
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print('Daily evidence JSON validated')
          PY
