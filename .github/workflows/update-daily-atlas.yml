name: Update Daily Oncology Atlas

on:
  push:
    branches: [main]
    paths:
      - 'data/daily-evidence-*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge all daily evidence into the atlas
        run: python scripts/merge_all_daily_evidence.py

      - name: Validate atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          assert 'const trials=[' in text
          assert 'defaultEvidence' not in text
          assert 'Uro-oncology' not in text
          assert 'Multidisciplinary' not in text

          files = sorted(Path('data').glob('daily-evidence-*.json'))
          total = sum(len(json.loads(p.read_text(encoding='utf-8'))) for p in files)
          m = re.search(r'const trials=(\[.*?\]);(?=const )', text, re.S)
          assert m, 'Navigation trials block missing'
          trials = json.loads(m.group(1))
          ids = {x.get('path','').split('/')[-1] for x in trials if x.get('path','').startswith('__evidence__/')}
          assert len(trials) >= len(ids)
          print(f'Atlas validation passed: {total} daily records available; {len(trials)} navigation entries indexed.')
          PY

      - name: Commit atlas changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No atlas changes'
          else
            git commit -m 'Update daily oncology evidence atlas'
            git push
          fi
