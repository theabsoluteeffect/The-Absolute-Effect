name: Update Daily Oncology Atlas
on: push
permissions:
  contents: write
jobs:
  update-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate daily evidence and rotate Trial of the Day
        run: python scripts/update_daily_atlas.py
      - name: Repair tumour site filter state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'siteEl.onchange=()=>{ renderFilters(false); renderQuestionFilter(); renderEntry(); };'
          new = 'siteEl.onchange=()=>{ renderFilters(true); renderQuestionFilter(); renderEntry(); };'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected tumour site filter handler not found')
          p.write_text(s, encoding='utf-8')
          print('Tumour site filter repair applied')
          PY
      - name: Validate atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text = Path('index.html').read_text(encoding='utf-8')
          assert text.count('TRIAL_OF_THE_DAY_START') == 1
          assert text.count('TRIAL_OF_THE_DAY_END') == 1
          assert 'function getSettings' in text
          assert text.count('const defaultEvidence=') == 1
          assert 'siteEl.onchange=()=>{ renderFilters(true); renderQuestionFilter(); renderEntry(); };' in text
          for p in Path('data').glob('daily-evidence-*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('Atlas validation passed')
          PY
      - name: Commit atlas changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot].noreply.github.com'
          git add index.html data/trial-archive.json data/previous-trial-of-the-day.json
          if git diff --cached --quiet; then
            echo 'No atlas changes'
          else
            git commit -m 'Update daily oncology evidence atlas'
            git push
          fi
