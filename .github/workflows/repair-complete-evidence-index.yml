name: Repair complete evidence index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge all full evidence into atlas dropdown
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, urllib.request
          import subprocess

          root=Path('.')
          html_path=root/'index.html'
          html=html_path.read_text(encoding='utf-8')

          # Parse the existing JavaScript trials array safely.
          m=re.search(r'const trials=(\[.*?\]);\nconst DISCIPLINES', html, re.S)
          if not m:
              raise SystemExit('Could not locate trials array')
          existing=json.loads(m.group(1).replace("'", '"'))

          # Preserve the established static pages and their exact metadata.
          existing_by_trial={x['trial'].lower():x for x in existing}
          existing_by_id={
              'javelin bladder 100': 'javelin-bladder-100',
              'sorce': 'sorce',
              'assure': 'assure',
              'everest': 'everest',
              'eortc 30986': 'eortc-30986',
              'mrc/eortc bep vs ceb': 'mrc-eortc-bep-vs-ceb',
              'getug-afu 16': 'getug-afu-16',
              'nsabp b-18': 'nsabp-b18',
              'nsabp b-27': 'nsabp-b27',
              'randomized trial of adjuvant 5-fu-platinum vs paclitaxel-platinum': 'penile-adjuvant-5fu-vs-paclitaxel'
          }

          urls=[
            'https://raw.githubusercontent.com/theabsoluteeffect/The-Absolute-Effect/main/data/daily-evidence-2026-09-06.json',
            'https://raw.githubusercontent.com/theabsoluteeffect/The-Absolute-Effect/main/data/daily-evidence-2026-09-06-batch2.json'
          ]
          records=[]
          for u in urls:
              with urllib.request.urlopen(u) as r:
                  records.extend(json.loads(r.read().decode('utf-8')))

          # Deduplicate by id/trial, preferring the first full record.
          seen=set(); full=[]
          for x in records:
              key=(str(x.get('id') or x.get('trial') or '').strip().lower())
              if not key or key in seen: continue
              seen.add(key); full.append(x)

          merged=list(existing)
          merged_keys={(x['site'].lower(),x['discipline'].lower(),x['setting'].lower(),x['trial'].lower()) for x in merged}
          viewer_records=[]

          for x in full:
              trial=x.get('trial','').strip()
              site=x.get('site','').strip()
              discipline=x.get('discipline','').strip()
              setting=x.get('setting','').strip()
              question=x.get('clinicalQuestion','').strip()
              # ProtecT's legacy source taxonomy is normalized to the requested atlas discipline.
              if discipline.lower()=='uro-oncology':
                  discipline='Surgical Oncology'
              key=(site.lower(),discipline.lower(),setting.lower(),trial.lower())

              # If this evidence record already has a dedicated page, keep that route.
              path=None
              for k,p in existing_by_id.items():
                  if trial.lower()==k:
                      path=p
              if not path and trial.lower() in existing_by_trial:
                  path=existing_by_trial[trial.lower()].get('path')

              viewer_id=x.get('id') or re.sub(r'[^a-z0-9]+','-',trial.lower()).strip('-')
              viewer_records.append(x | {'discipline':discipline, '_viewerId':viewer_id, '_path':path})

              if key not in merged_keys:
                  merged.append({
                      'site':site,
                      'discipline':discipline,
                      'setting':setting,
                      'trial':trial,
                      'question':question,
                      'path':path if path else '__evidence__/'+viewer_id
                  })
                  merged_keys.add(key)

          # Replace the trials array.
          new_array=json.dumps(merged,ensure_ascii=False,separators=(',',':'))
          html=html[:m.start(1)] + new_array + html[m.end(1):]

          # Make links work for both dedicated pages and generic full-evidence pages.
          html=html.replace(
              "function render(){const matches=matching();",
              "function hrefFor(t){return t.path&&t.path.startsWith('__evidence__/')?'evidence.html?id='+encodeURIComponent(t.path.slice('__evidence__/'.length)):'trial-pages/'+t.path+'/'}\nfunction render(){const matches=matching();"
          )
          html=html.replace('href="trial-pages/${t.path}/"','href="${hrefFor(t)}"')

          html_path.write_text(html,encoding='utf-8')

          # Build one generic evidence viewer for records that do not yet have dedicated pages.
          evidence={x['_viewerId']:x for x in viewer_records}
          viewer='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Entry | The Absolute Effect</title><style>:root{--ink:#171717;--muted:#666;--bg:#f7f7f5;--card:#fff;--line:#e3e3df}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}main{max-width:900px;margin:auto;padding:36px 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin:18px 0}.eyebrow,.tag{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#666}.back{display:inline-block;margin-bottom:20px;color:#222}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{font-size:11px;font-weight:800;color:#777;text-transform:uppercase;letter-spacing:.08em}.value{font-size:17px}.effect{font-size:30px;font-weight:800}.muted{color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="./">← Back to The Absolute Effect</a><div id="app"></div><script>const DATA='''+json.dumps(evidence,ensure_ascii=False,separators=(',',':'))+''';const id=new URLSearchParams(location.search).get('id');const x=DATA[id];const app=document.getElementById('app');if(!x){app.innerHTML='<div class="card"><h1>Evidence entry not found</h1><p class="muted">Return to the atlas and choose another entry.</p></div>'}else{const pct=v=>v===0?'0%':(typeof v==='number'?v+'%':(v||'Not reported'));app.innerHTML=`<p class="eyebrow">${x.site} · ${x.discipline} · ${x.setting}</p><h1>${x.trial}</h1><p>${x.clinicalQuestion||''}</p><div class="card"><h2>What was studied?</h2><p><strong>Population:</strong> ${x.population||'Not reported'}</p><p><strong>Treatment:</strong> ${x.treatment||'Not reported'}</p><p><strong>Endpoint:</strong> ${x.endpoint||'Not reported'}</p><p><strong>Horizon:</strong> ${x.horizon||'Not reported'}</p></div><div class="card"><h2>Absolute Effect</h2><div class="grid"><div><div class="label">Absolute benefit</div><div class="effect">${x.absoluteBenefit!==undefined?x.absoluteBenefit:'Not reported'}</div></div><div><div class="label">NNT</div><div class="effect">${x.nnt||'Not applicable'}</div></div></div><p>${x.benefitText||''}</p></div><div class="card"><h2>Relative Effect</h2><p><strong>${x.relativeLabel||'Effect'}:</strong> ${x.relativeEffect||'Not reported'}</p><p><strong>Confidence interval / statistics:</strong> ${x.ci||'Not reported'}</p></div><div class="card"><h2>Harm</h2><p><strong>${x.harmLabel||'Treatment-related harm'}:</strong> ${x.harmIncrease!==undefined?x.harmIncrease+' percentage points':'Not reported'}</p><p><strong>NNH:</strong> ${x.nnH||'Not applicable'}</p></div><div class="card"><h2>References</h2><ul>${(x.refs||[]).map(r=>'<li>'+r+'</li>').join('')}</ul><p>${(x.urls||[]).map(u=>'<a href="'+u+'" target="_blank" rel="noopener">Primary publication / source →</a>').join('<br>')}</p></div></div>`}</script></main></body></html>'''
          (root/'evidence.html').write_text(viewer,encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html evidence.html
          git rm .github/workflows/repair-complete-evidence-index.yml
          git commit -m 'Integrate all indexed evidence into atlas dropdown'
          git push
