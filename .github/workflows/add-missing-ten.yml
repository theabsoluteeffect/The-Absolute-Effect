name: Add missing ten evidence trials
on:
  push:
    paths:
      - '.github/workflows/add-missing-ten.yml'
  workflow_dispatch:
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrate ten trials
        run: |
          python - <<'PY'
          import json,re,pathlib
          records=[
          {"id":"nsabp-b04","site":"Breast Cancer","discipline":"Surgical Oncology","setting":"Locoregional Disease","treatment":"Total mastectomy without axillary dissection vs radical mastectomy","population":"1,665 women with operable breast cancer; clinically node-negative and node-positive cohorts","endpoint":"25-year overall survival","horizon":"25 years","interventionRate":26,"controlRate":25,"absoluteBenefit":1,"nnt":"Not applicable; no significant survival advantage","relativeLabel":"HR","relativeEffect":"1.03 for total mastectomy vs radical mastectomy in node-negative patients","ci":"95% CI 0.87–1.23; P=.72","n":1765,"interventionN":365,"controlN":362,"benefitText":"At 25 years, overall survival among clinically node-negative women was 26% after total mastectomy alone versus 25% after radical mastectomy; HR 1.03 (95% CI 0.87–1.23). There was no significant survival difference. Total mastectomy plus radiation also showed no survival advantage. The major difference was better locoregional control with radiation, not survival.","harmLabel":"Axillary morbidity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the primary endpoint","trial":"NSABP B-04","clinicalQuestion":"Does radical mastectomy improve long-term survival compared with less extensive breast and axillary surgery in operable breast cancer?","refs":["Fisher B, et al. N Engl J Med. 2002;347:567–575."],"urls":["https://www.nejm.org/doi/full/10.1056/NEJMoa020128"]},
          {"id":"dbcg-82b","site":"Breast Cancer","discipline":"Radiation Oncology","setting":"Locoregional Disease","treatment":"Mastectomy + postmastectomy RT + systemic therapy vs mastectomy + systemic therapy","population":"1,708 premenopausal women with high-risk stage II/III breast cancer","endpoint":"10-year overall survival","horizon":"10 years","interventionRate":54,"controlRate":45,"absoluteBenefit":9,"nnt":"12","relativeLabel":"OS absolute benefit","relativeEffect":"10-year OS 54% vs 45%","ci":"P<.001","n":1708,"interventionN":852,"controlN":856,"benefitText":"DBCG 82b increased 10-year overall survival from 45% to 54%, an absolute improvement of 9 percentage points (NNT 12). Ten-year locoregional recurrence fell from 32% to 9%, an absolute reduction of 23 points (NNT 5). NNT for OS is based on 10-year survival.","harmLabel":"Radiotherapy toxicity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the selected long-term endpoint","trial":"DBCG 82b","clinicalQuestion":"Does postmastectomy radiotherapy improve outcomes in high-risk premenopausal stage II/III breast cancer?","refs":["Overgaard M, et al. N Engl J Med. 1997;337:949–955.","Overgaard M, et al. Acta Oncol. 2007;46:533–551."],"urls":["https://pubmed.ncbi.nlm.nih.gov/9335901/"]},
          {"id":"rtog-0534-spport","site":"Prostate Cancer","discipline":"Radiation Oncology","setting":"Post-prostatectomy Biochemical Recurrence","treatment":"Prostate-bed RT + short-term ADT + pelvic nodal RT vs prostate-bed RT alone","population":"1,716 eligible men with PSA persistence or biochemical recurrence after prostatectomy","endpoint":"5-year freedom from progression","horizon":"5 years","interventionRate":87.4,"controlRate":70.9,"absoluteBenefit":16.5,"nnt":"7","relativeLabel":"HR","relativeEffect":"0.50 for pelvic nodal RT + ADT vs prostate-bed RT alone","ci":"97.5% CI 0.39–0.64","n":1716,"interventionN":598,"controlN":592,"benefitText":"At 5 years, freedom from progression was 87.4% with prostate-bed RT plus short-term ADT and pelvic nodal RT versus 70.9% with prostate-bed RT alone, an absolute improvement of 16.5 percentage points (NNT 7). Adding ADT to prostate-bed RT alone produced an intermediate 81.3% rate. Acute grade 2+ toxicity was 44.6% vs 19.7% with pelvic nodal treatment, so the benefit comes with greater short-term toxicity.","harmLabel":"Acute grade 2+ adverse events","harmIntervention":44.6,"harmControl":19.7,"harmIncrease":24.9,"nnH":"5","trial":"RTOG 0534 SPPORT","clinicalQuestion":"Does adding short-term ADT and pelvic nodal RT improve freedom from progression after prostatectomy salvage RT?","refs":["Pollack A, et al. Lancet. 2022;399:1886–1901."],"urls":["https://pubmed.ncbi.nlm.nih.gov/35569466/"]},
          {"id":"keynote-564","site":"Renal Cell Carcinoma","discipline":"Medical Oncology","setting":"Adjuvant","treatment":"Adjuvant pembrolizumab vs placebo after nephrectomy","population":"994 patients with high-risk clear-cell RCC after nephrectomy, with or without completely resected metastases","endpoint":"24-month disease-free survival","horizon":"24 months","interventionRate":77.3,"controlRate":68.1,"absoluteBenefit":9.2,"nnt":"11","relativeLabel":"HR","relativeEffect":"0.68","ci":"95% CI 0.53–0.87; P=.002","n":994,"interventionN":496,"controlN":498,"benefitText":"At 24 months, disease-free survival was 77.3% with pembrolizumab versus 68.1% with placebo, an absolute benefit of 9.2 percentage points (NNT 11). Overall survival at 24 months was 96.6% vs 93.5%. Grade 3+ adverse events were 32.4% vs 17.7%.","harmLabel":"Grade 3+ adverse events","harmIntervention":32.4,"harmControl":17.7,"harmIncrease":14.7,"nnH":"7","trial":"KEYNOTE-564","clinicalQuestion":"Does adjuvant pembrolizumab improve disease-free and overall survival after nephrectomy for high-risk clear-cell RCC?","refs":["Choueiri TK, et al. N Engl J Med. 2021;385:683–694.","Powles T, et al. N Engl J Med. 2024;390:1359–1371."],"urls":["https://www.nejm.org/doi/full/10.1056/NEJMoa2106391","https://www.nejm.org/doi/full/10.1056/NEJMoa2312695"]},
          {"id":"s-trac","site":"Renal Cell Carcinoma","discipline":"Medical Oncology","setting":"Adjuvant","treatment":"Adjuvant sunitinib vs placebo after nephrectomy","population":"615 patients with high-risk clear-cell RCC after nephrectomy","endpoint":"5-year disease-free survival","horizon":"5 years","interventionRate":59.3,"controlRate":51.3,"absoluteBenefit":8,"nnt":"13","relativeLabel":"HR","relativeEffect":"0.76","ci":"95% CI 0.59–0.98; P=.03","n":615,"interventionN":309,"controlN":306,"benefitText":"At 5 years, disease-free survival was 59.3% with sunitinib versus 51.3% with placebo, an absolute benefit of 8 percentage points (NNT 13). Median DFS was 6.8 vs 5.6 years. The DFS benefit came with substantial toxicity and treatment discontinuation.","harmLabel":"Grade 3 treatment-emergent adverse events","harmIntervention":48.4,"harmControl":15.8,"harmIncrease":32.6,"nnH":"4","trial":"S-TRAC","clinicalQuestion":"Does adjuvant sunitinib improve disease-free survival after nephrectomy in high-risk clear-cell RCC?","refs":["Ravaud A, et al. N Engl J Med. 2016;375:2246–2254."],"urls":["https://www.nejm.org/doi/full/10.1056/NEJMoa1611406"]},
          {"id":"checkmate-914","site":"Renal Cell Carcinoma","discipline":"Medical Oncology","setting":"Adjuvant","treatment":"Adjuvant nivolumab + ipilimumab vs placebo after nephrectomy","population":"816 patients with localized RCC at high risk of recurrence after nephrectomy","endpoint":"24-month disease-free survival","horizon":"24 months","interventionRate":76,"controlRate":74,"absoluteBenefit":2,"nnt":"50","relativeLabel":"HR","relativeEffect":"0.92","ci":"95% CI 0.71–1.19; P=.53","n":816,"interventionN":405,"controlN":411,"benefitText":"At 24 months, disease-free survival was 76% with nivolumab plus ipilimumab versus 74% with placebo, an absolute difference of only 2 percentage points (NNT 50). The primary DFS endpoint was not met. Grade 3–5 adverse events were 38% vs 10%, and treatment discontinuation was 32% vs 2%.","harmLabel":"Grade 3–5 adverse events","harmIntervention":38,"harmControl":10,"harmIncrease":28,"nnH":"4","trial":"CheckMate 914","clinicalQuestion":"Does adjuvant nivolumab plus ipilimumab improve disease-free survival after nephrectomy for high-risk RCC?","refs":["Motzer RJ, et al. Lancet. 2023;401:821–832."],"urls":["https://pmc.ncbi.nlm.nih.gov/articles/PMC10259621/"]},
          {"id":"eortc-30994","site":"Bladder Cancer","discipline":"Medical Oncology","setting":"Adjuvant","treatment":"Immediate adjuvant cisplatin-based chemotherapy vs deferred chemotherapy at relapse","population":"284 patients with pT3–pT4 and/or N+ M0 urothelial carcinoma after radical cystectomy","endpoint":"5-year progression-free survival","horizon":"5 years","interventionRate":47.6,"controlRate":31.8,"absoluteBenefit":15.8,"nnt":"7","relativeLabel":"HR","relativeEffect":"0.54","ci":"95% CI 0.40–0.73; P<.0001","n":284,"interventionN":141,"controlN":143,"benefitText":"Immediate chemotherapy increased 5-year progression-free survival from 31.8% to 47.6%, an absolute improvement of 15.8 points (NNT 7). Overall survival was not significantly improved: 5-year OS 53.6% vs 47.7%, HR 0.78, P=.13. The trial closed early and was underpowered for OS.","harmLabel":"Grade 3–4 myelosuppression","harmIntervention":26,"harmControl":35,"harmIncrease":-9,"nnH":"Not applicable; toxicity comparisons are confounded by more patients receiving deferred treatment at relapse","trial":"EORTC 30994","clinicalQuestion":"Does immediate adjuvant chemotherapy improve outcomes compared with deferred chemotherapy after radical cystectomy?","refs":["Sternberg CN, et al. Lancet Oncol. 2015;16:76–86."],"urls":["https://pubmed.ncbi.nlm.nih.gov/25498218/"]},
          {"id":"eortc-30992","site":"Penile Cancer","discipline":"Medical Oncology","setting":"Neoadjuvant/Locally Advanced","treatment":"Irinotecan + cisplatin","population":"28 patients with T3/T4, N1–N3 or M1 cisplatin-advanced penile carcinoma","endpoint":"Objective response rate","horizon":"During treatment","interventionRate":30.8,"controlRate":0,"absoluteBenefit":30.8,"nnt":"Not applicable; single-arm phase II","relativeLabel":"ORR","relativeEffect":"8/26 eligible patients responded","ci":"80% CI 18.8–45.1%; prespecified threshold >30% not demonstrated","n":28,"interventionN":26,"controlN":0,"benefitText":"Irinotecan plus cisplatin produced 8 responses among 26 eligible patients, an objective response rate of 30.8%. The study was designed to exclude a response rate below 30% but did not demonstrate that threshold statistically. There were 3 grade 3 diarrhoeas and 2 grade 4 neutropenic fevers. NNT is not applicable because this was single-arm.","harmLabel":"Grade 3–4 selected toxicity","harmIntervention":5,"harmControl":0,"harmIncrease":5,"nnH":"Not applicable; single-arm study","trial":"EORTC 30992","clinicalQuestion":"Can irinotecan plus cisplatin produce clinically meaningful responses in locally advanced or metastatic penile cancer?","refs":["Pizzocaro G, et al. Ann Oncol. 2008;19:1304–1307."],"urls":["https://pubmed.ncbi.nlm.nih.gov/18417462/"]},
          {"id":"eortc-30941-te20","site":"Germ Cell Tumours","discipline":"Medical Oncology","setting":"Good-Risk Metastatic Germ Cell Cancer","treatment":"Three cycles BEP vs four cycles (3 BEP + 1 EP)","population":"812 men with good-prognosis metastatic germ-cell cancer","endpoint":"2-year progression-free survival","horizon":"2 years","interventionRate":90.4,"controlRate":89.4,"absoluteBenefit":1,"nnt":"Not applicable; equivalence trial","relativeLabel":"HR","relativeEffect":"0.93","ci":"80% CI 0.71–1.24; equivalence criterion met","n":812,"interventionN":406,"controlN":406,"benefitText":"Three cycles of BEP produced a projected 2-year PFS of 90.4% versus 89.4% with four cycles, a 1-point difference. The trial was designed to rule out a clinically important loss of efficacy and established three cycles as sufficient for good-prognosis disease. Three cycles also reduced treatment burden. NNT is not appropriate for an equivalence comparison.","harmLabel":"Quality-of-life and treatment burden","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the primary endpoint; fewer cycles improved several short-term quality-of-life measures","trial":"EORTC 30941 / MRC TE20","clinicalQuestion":"Can three cycles of BEP provide equivalent disease control to four cycles in good-prognosis metastatic germ-cell cancer while reducing treatment burden?","refs":["de Wit R, et al. J Clin Oncol. 2001;19:1629–1640."],"urls":["https://pubmed.ncbi.nlm.nih.gov/11250991/"]},
          {"id":"fastrack-ii","site":"Renal Cell Carcinoma","discipline":"Radiation Oncology","setting":"Localized Primary RCC","treatment":"Definitive SABR: 26 Gy single fraction for ≤4 cm tumours or 42 Gy in 3 fractions for >4–10 cm tumours","population":"70 patients with biopsy-confirmed primary RCC who were medically inoperable, high surgical risk or declined surgery","endpoint":"12-month local control","horizon":"12 months","interventionRate":100,"controlRate":0,"absoluteBenefit":100,"nnt":"Not applicable; single-arm phase II","relativeLabel":"Local control","relativeEffect":"100% at 12 months","ci":"Primary endpoint met; prespecified threshold was 90%","n":70,"interventionN":70,"controlN":0,"benefitText":"FASTRACK II achieved 100% local control at 12 months in 70 treated patients, exceeding the prespecified 90% target. Median follow-up in the primary publication was 43 months. Grade 3 toxicity occurred in fewer than 10% of patients and there were no grade 4–5 events. This was a single-arm phase II study, so no comparative NNT can be assigned.","harmLabel":"Grade 3 treatment-related toxicity","harmIntervention":9.1,"harmControl":0,"harmIncrease":9.1,"nnH":"Not applicable; single-arm study","trial":"FASTRACK II","clinicalQuestion":"Can stereotactic ablative body radiotherapy provide effective definitive local control for primary RCC in patients unsuitable for surgery?","refs":["Siva S, et al. Lancet Oncol. 2024;25:308–316."],"urls":["https://pubmed.ncbi.nlm.nih.gov/38423047/"]}
          ]
          p=pathlib.Path('data/daily-evidence-2026-09-09-batch3.json'); p.write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          ep=pathlib.Path('evidence.html'); s=ep.read_text(); m=re.search(r'const DATA=(\{.*?\});</script>',s)
          data=json.loads(m.group(1))
          for r in records: data[r['id']]=r
          s=s[:m.start(1)]+json.dumps(data,ensure_ascii=False,separators=(',',':'))+s[m.end(1):]
          ep.write_text(s)
          ip=pathlib.Path('index.html'); s=ip.read_text(); m=re.search(r'const trials=(\[.*?\]);',s)
          trials=json.loads(m.group(1)); ids={x.get('trial') for x in trials}
          add=[]
          for r in records:
            if r['trial'] not in ids:
              add.append({'site':r['site'],'discipline':r['discipline'],'setting':r['setting'],'trial':r['trial'],'question':r['clinicalQuestion'],'path':'__evidence__/'+r['id']})
          trials.extend(add)
          s=s[:m.start(1)]+json.dumps(trials,ensure_ascii=False,separators=(',',':'))+s[m.end(1):]
          ip.write_text(s)
          print('Added',len(add),'new trial index entries; total',len(trials))
          PY
      - name: Verify
        run: |
          python - <<'PY'
          import json,re,pathlib
          s=pathlib.Path('index.html').read_text(); trials=json.loads(re.search(r'const trials=(\[.*?\]);',s).group(1))
          e=pathlib.Path('evidence.html').read_text(); data=json.loads(re.search(r'const DATA=(\{.*?\});</script>',e).group(1))
          wanted=['NSABP B-04','DBCG 82b','RTOG 0534 SPPORT','KEYNOTE-564','S-TRAC','CheckMate 914','EORTC 30994','EORTC 30992','EORTC 30941 / MRC TE20','FASTRACK II']
          assert all(any(x['trial']==w for x in trials) for w in wanted)
          assert all(any(x.get('trial')==w for x in data.values()) for w in wanted)
          assert len(trials)==len({x['trial'] for x in trials})
          print('Verified:',len(trials),'unique indexed trials and all 10 full evidence records.')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily-evidence-2026-09-09-batch3.json evidence.html index.html
          git commit -m 'Add ten missing evidence trials to atlas'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/add-missing-ten.yml
          git commit -m 'Remove one-time missing trial integration workflow'
          git push
