name: Update Dose Matters articles

on:
  push:
    paths:
      - ".github/workflows/update-substack.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-substack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Substack RSS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 60 \
            -A "Mozilla/5.0 (compatible; The-Absolute-Effect/1.0; +https://github.com/theabsoluteeffect/The-Absolute-Effect)" \
            -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            "https://dosematters.substack.com/feed" -o substack-feed.xml
          test -s substack-feed.xml

      - name: Build article list
        shell: python
        run: |
          import json, re, xml.etree.ElementTree as ET
          from html import unescape

          with open("substack-feed.xml", "rb") as f:
              xml = f.read()

          root = ET.fromstring(xml)
          posts = []
          for item in root.findall(".//item")[:6]:
              def txt(tag):
                  x = item.find(tag)
                  return (x.text or "").strip() if x is not None else ""
              title = unescape(txt("title"))
              link = txt("link")
              date = txt("pubDate")
              desc = txt("description")
              desc = re.sub(r"<[^>]+>", " ", unescape(desc))
              desc = re.sub(r"\s+", " ", desc).strip()
              if len(desc) > 220:
                  desc = desc[:217].rsplit(" ", 1)[0] + "…"
              if title and link:
                  posts.append({"title": title, "link": link, "date": date, "excerpt": desc})

          if not posts:
              raise SystemExit("No Substack posts found")

          with open("substack.json", "w", encoding="utf-8") as f:
              json.dump(posts[:6], f, ensure_ascii=False, indent=2)
              f.write("\n")

      - name: Commit updated article list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack.json
          git diff --cached --quiet || git commit -m "Update Dose Matters articles"
          git push
