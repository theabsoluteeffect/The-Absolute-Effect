name: Update Dose Matters articles

on:
  push:
    paths:
      - ".github/workflows/update-substack.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-substack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Substack feed
        shell: bash
        run: |
          set -euo pipefail
          rm -f substack-source.json substack-feed.xml

          # Substack can return 403 to GitHub Actions IPs. Use public RSS
          # retrieval fallbacks instead of repeatedly retrying the same request.
          if curl --fail --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 15 --max-time 45 \
            -A "Mozilla/5.0" \
            "https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fdosematters.substack.com%2Ffeed" \
            -o substack-source.json; then
            python - <<'PY'
          import json
          with open("substack-source.json", encoding="utf-8") as f:
              data=json.load(f)
          if data.get("status") != "ok" or not data.get("items"):
              raise SystemExit("rss2json returned no usable posts")
          print(f"Fetched {len(data['items'])} posts via RSS2JSON")
          PY
          else
            rm -f substack-source.json
          fi

          if [ ! -s substack-source.json ]; then
            if curl --fail --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 15 --max-time 45 \
              -A "Mozilla/5.0" \
              "https://r.jina.ai/http://dosematters.substack.com/feed" \
              -o substack-feed.xml; then
              test -s substack-feed.xml
              python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("substack-feed.xml")
          print("Fetched Substack RSS via Jina")
          PY
            else
              rm -f substack-feed.xml
            fi
          fi

          if [ ! -s substack-source.json ] && [ ! -s substack-feed.xml ]; then
            curl --fail --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 15 --max-time 45 \
              -A "Mozilla/5.0" \
              -H "Accept: application/rss+xml, application/xml, text/xml" \
              "https://dosematters.substack.com/feed" \
              -o substack-feed.xml
            test -s substack-feed.xml
            python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("substack-feed.xml")
          print("Fetched Substack RSS directly")
          PY
          fi

      - name: Parse latest 6 articles
        shell: python
        run: |
          import json, os, re
          import xml.etree.ElementTree as ET
          from html import unescape
          from urllib.parse import urljoin

          def clean(value):
              value = unescape(str(value or ""))
              value = re.sub(r"<[^>]+>", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          posts = []
          if os.path.exists("substack-source.json"):
              with open("substack-source.json", encoding="utf-8") as f:
                  data = json.load(f)
              for item in data.get("items", [])[:6]:
                  posts.append({
                      "title": clean(item.get("title")),
                      "link": str(item.get("link") or item.get("url") or "").strip(),
                      "date": item.get("pubDate") or item.get("published") or item.get("date") or "",
                      "excerpt": clean(item.get("description") or item.get("content") or item.get("summary")),
                  })
          else:
              root = ET.parse("substack-feed.xml").getroot()
              for item in root.findall(".//item")[:6]:
                  def text(name):
                      node = item.find(name)
                      return node.text if node is not None else ""
                  posts.append({
                      "title": clean(text("title")),
                      "link": clean(text("link")),
                      "date": clean(text("pubDate")),
                      "excerpt": clean(text("description")),
                  })

          valid = []
          for post in posts:
              if post["link"].startswith("/"):
                  post["link"] = urljoin("https://dosematters.substack.com", post["link"])
              if post["title"] and post["link"].startswith("https://dosematters.substack.com/"):
                  if len(post["excerpt"]) > 220:
                      post["excerpt"] = post["excerpt"][:217].rsplit(" ", 1)[0] + "…"
                  valid.append(post)

          if not valid:
              raise SystemExit("No usable Substack posts found")

          with open("substack.json", "w", encoding="utf-8") as f:
              json.dump(valid[:6], f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Prepared {len(valid[:6])} articles")

      - name: Commit updated article list
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack.json
          if git diff --cached --quiet; then
            echo "No article changes"
          else
            git commit -m "Update Dose Matters articles"
            git push
          fi
