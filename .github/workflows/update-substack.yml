name: Update Dose Matters articles

on:
  push:
    paths:
      - ".github/workflows/update-substack.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-substack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Substack archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://dosematters.substack.com/api/v1/archive?sort=new&search=&offset=0&limit=6"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 60 \
            -A "Mozilla/5.0 (compatible; The-Absolute-Effect/1.0; +https://github.com/theabsoluteeffect/The-Absolute-Effect)" \
            -H "Accept: application/json" \
            -H "Referer: https://dosematters.substack.com/" \
            "$url" -o substack-archive.json
          test -s substack-archive.json
          python - <<'PY'
          import json
          with open("substack-archive.json", encoding="utf-8") as f:
              data=json.load(f)
          if not isinstance(data,list) or not data:
              raise SystemExit("Substack archive returned no posts")
          print(f"Fetched {len(data)} posts")
          PY

      - name: Build article list
        shell: python
        run: |
          import json, re
          from html import unescape
          from urllib.parse import urljoin

          with open("substack-archive.json", encoding="utf-8") as f:
              items=json.load(f)

          posts=[]
          for item in items[:6]:
              title=unescape(str(item.get("title") or item.get("name") or "")).strip()
              link=(item.get("canonical_url") or item.get("canonicalUrl") or item.get("url") or "").strip()
              if link and link.startswith("/"):
                  link=urljoin("https://dosematters.substack.com",link)
              date=(item.get("post_date") or item.get("postDate") or item.get("published_at") or item.get("publishedAt") or item.get("date") or "")
              desc=(item.get("description") or item.get("subtitle") or item.get("excerpt") or "")
              desc=re.sub(r"<[^>]+>"," ",unescape(str(desc)))
              desc=re.sub(r"\s+"," ",desc).strip()
              if len(desc)>220:
                  desc=desc[:217].rsplit(" ",1)[0]+"…"
              if title and link:
                  posts.append({"title":title,"link":link,"date":date,"excerpt":desc})

          if not posts:
              raise SystemExit("No usable Substack posts found")

          with open("substack.json","w",encoding="utf-8") as f:
              json.dump(posts[:6],f,ensure_ascii=False,indent=2)
              f.write("\n")

      - name: Commit updated article list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack.json
          git diff --cached --quiet || git commit -m "Update Dose Matters articles"
          git push
