name: Improve evidence comparator and visual comparison
on:
  push:
    paths:
      - '.github/workflows/fix-evidence-comparator-visual.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch evidence data and visual template
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/daily-evidence-2026-09-06.json')
          data=json.loads(p.read_text())
          for r in data:
              if r.get('id')=='calgb-9343':
                  r['intervention']='Tamoxifen + whole-breast RT after lumpectomy'
                  r['comparator']='Tamoxifen alone after lumpectomy (no RT)'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          p=pathlib.Path('evidence.html')
          s=p.read_text()
          old=".error{border-color:#c8a5a5}.error h1{margin-top:0}"
          new=""".error{border-color:#c8a5a5}.error h1{margin-top:0}.visual{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:22px}.visual-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.visual-title{font-size:17px;font-weight:800}.visual-note{font-size:13px;color:var(--muted)}.bars{display:grid;gap:16px}.bar-row{display:grid;grid-template-columns:minmax(170px,1.2fr) 3fr 64px;gap:12px;align-items:center}.bar-label{font-size:14px;font-weight:700}.bar-track{height:28px;border-radius:999px;background:#e9e9e4;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:#222;min-width:2px}.bar-value{font-size:16px;font-weight:850;text-align:right}.comparison-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.comparison-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}.comparison-card .tag{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--muted);margin-bottom:7px}.comparison-card strong{font-size:15px}.delta{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-weight:750}.delta span{font-size:20px;margin-right:7px}@media(max-width:760px){.bar-row{grid-template-columns:1fr 2fr 54px}.comparison-cards{grid-template-columns:1fr}}"""
          if old not in s: raise SystemExit('CSS anchor not found')
          s=s.replace(old,new,1)

          old="""const rates=x.interventionRate!=null&&x.controlRate!=null?`${x.interventionRate}% vs ${x.controlRate}%`:'Not quantified';
 const abs=x.absoluteBenefit!=null?` (${x.absoluteBenefit>0?'+':''}${x.absoluteBenefit} pp)`:'';
 return {site:x.site||'',discipline:x.discipline||'',setting:x.setting||'',trial:x.trial||x.name||'',question:x.clinicalQuestion||x.question||'',population:x.population||'',intervention:x.intervention||x.treatment||'',comparator:x.comparator||'',endpoint:x.endpoint||'',horizon:x.horizon||'',benefit:x.benefitText||`${x.endpoint||'Outcome'}: ${rates}${abs}`,nnt:x.nnt||'Not appropriately calculable',harm:x.harmText||x.harmLabel||'Not quantified in the source entry',nnh:x.nnH||x.nnh||'Not appropriately calculable',relative:x.relativeEffect?(x.relativeLabel||'Relative effect')+': '+x.relativeEffect+(x.ci?' ('+x.ci+')':''):(x.relative||''),statistics:x.statistics||'',takeaway:x.clinicalInterpretation||x.takeaway||x.benefitText||'',refs:x.refs||[],url:(x.urls&&x.urls[0])||x.url||''};"""
          new="""const parts=String(x.treatment||'').split(/\\s+vs\\.?\\s+/i);
 const intervention=x.intervention||parts[0]||'';
 const comparator=x.comparator||parts.slice(1).join(' vs ')||'Not reported';
 const rates=x.interventionRate!=null&&x.controlRate!=null?`${x.interventionRate}% vs ${x.controlRate}%`:'Not quantified';
 const abs=x.absoluteBenefit!=null?` (${x.absoluteBenefit>0?'+':''}${x.absoluteBenefit} pp)`:'';
 return {site:x.site||'',discipline:x.discipline||'',setting:x.setting||'',trial:x.trial||x.name||'',question:x.clinicalQuestion||x.question||'',population:x.population||'',intervention,comparator,endpoint:x.endpoint||'',horizon:x.horizon||'',benefit:x.benefitText||`${x.endpoint||'Outcome'}: ${rates}${abs}`,nnt:x.nnt||'Not appropriately calculable',harm:x.harmText||x.harmLabel||'Not quantified in the source entry',nnh:x.nnH||x.nnh||'Not appropriately calculable',relative:x.relativeEffect?(x.relativeLabel||'Relative effect')+': '+x.relativeEffect+(x.ci?' ('+x.ci+')':''):(x.relative||''),statistics:x.statistics||'',takeaway:x.clinicalInterpretation||x.takeaway||x.benefitText||'',refs:x.refs||[],url:(x.urls&&x.urls[0])||x.url||'',interventionRate:x.interventionRate,controlRate:x.controlRate,absoluteBenefit:x.absoluteBenefit};"""
          if old not in s: raise SystemExit('normalize anchor not found')
          s=s.replace(old,new,1)

          old="""<section class=\"section\"><h2>Absolute Effect</h2><div class=\"effect-grid\"><div class=\"effect\"><div class=\"label\">Benefit</div><div class=\"number\">${esc(x.benefit)}</div><div class=\"small\">Time horizon: ${esc(x.horizon||'Not specified')}</div><p><strong>NNT:</strong> ${esc(x.nnt)}</p></div><div class=\"effect\"><div class=\"label\">Harm / treatment burden</div><div class=\"number\">${esc(x.harm)}</div><div class=\"small\">Reported endpoint or treatment burden</div><p><strong>NNH:</strong> ${esc(x.nnh)}</p></div></div></section>"""
          new="""<section class=\"section\"><h2>Absolute Effect</h2><div class=\"effect-grid\"><div class=\"effect\"><div class=\"label\">Benefit</div><div class=\"number\">${esc(x.benefit)}</div><div class=\"small\">Time horizon: ${esc(x.horizon||'Not specified')}</div><p><strong>NNT:</strong> ${esc(x.nnt)}</p></div><div class=\"effect\"><div class=\"label\">Harm / treatment burden</div><div class=\"number\">${esc(x.harm)}</div><div class=\"small\">Reported endpoint or treatment burden</div><p><strong>NNH:</strong> ${esc(x.nnh)}</p></div></div></section><section class=\"section\"><h2>Visual comparison</h2><div class=\"visual\"><div class=\"visual-head\"><div><div class=\"visual-title\">${esc(x.endpoint||'Primary outcome')}</div><div class=\"visual-note\">${esc(x.horizon||'Reported trial time point')}</div></div><div class=\"visual-note\">Higher bar = higher reported rate</div></div><div class=\"bars\"><div class=\"bar-row\"><div class=\"bar-label\">${esc(x.intervention)}</div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:${Math.max(0,Math.min(100,Number(x.interventionRate)||0))}%\"></div></div><div class=\"bar-value\">${x.interventionRate!=null?esc(x.interventionRate)+'%':'—'}</div></div><div class=\"bar-row\"><div class=\"bar-label\">${esc(x.comparator)}</div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:${Math.max(0,Math.min(100,Number(x.controlRate)||0))}%\"></div></div><div class=\"bar-value\">${x.controlRate!=null?esc(x.controlRate)+'%':'—'}</div></div></div><div class=\"comparison-cards\"><div class=\"comparison-card\"><div class=\"tag\">Intervention</div><strong>${esc(x.intervention)}</strong></div><div class=\"comparison-card\"><div class=\"tag\">Comparator</div><strong>${esc(x.comparator)}</strong></div></div><div class=\"delta\"><span>Δ</span>${x.absoluteBenefit!=null?`${x.absoluteBenefit>0?'+':''}${esc(x.absoluteBenefit)} percentage points`:'Absolute difference not reported'}</div></div></section>"""
          if old not in s: raise SystemExit('render anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          python - <<'PY'
          import json,pathlib,re
          r=next(x for x in json.loads(pathlib.Path('data/daily-evidence-2026-09-06.json').read_text()) if x['id']=='calgb-9343')
          assert r['comparator']=='Tamoxifen alone after lumpectomy (no RT)'
          s=pathlib.Path('evidence.html').read_text()
          for needle in ['Visual comparison','x.comparator||parts.slice(1).join','bar-fill','comparison-cards']:
              assert needle in s, needle
          print('Comparator and visual comparison verified for CALGB 9343.')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily-evidence-2026-09-06.json evidence.html
          git commit -m 'Add comparator and visual evidence comparison' || true
          git rm .github/workflows/fix-evidence-comparator-visual.yml
          git commit -m 'Remove one-time evidence visual workflow'
          git push
