name: Repair discipline options once

on:
  push:
    paths:
      - '.github/workflows/repair-discipline-options-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair discipline option source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const DISCIPLINES=['Radiation Oncology','Medical Oncology','Surgical Oncology'];"
          new = "const DISCIPLINES=Object.freeze(['Medical Oncology','Radiation Oncology','Surgical Oncology']);"
          if old not in s:
              raise SystemExit('Expected discipline declaration not found; refusing to modify the file.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time repair workflow and commit
        run: |
          rm .github/workflows/repair-discipline-options-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/repair-discipline-options-once.yml
          git commit -m 'Repair discipline dropdown options'
          git push
