<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Entry | The Absolute Effect</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f7f7f5;color:#171717;line-height:1.55}main{max-width:920px;margin:auto;padding:30px 20px}.card{background:#fff;border:1px solid #e3e3df;border-radius:16px;padding:22px;margin:18px 0}.eyebrow,.label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.effect{font-size:30px;font-weight:850}.dot-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:12px}.dot{display:block;aspect-ratio:1;border-radius:50%;background:#ddd}.dot.b{background:#171717!important}.dot.h{background:#777!important}.view-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.view-panel{border:1px solid #e3e3df;border-radius:12px;padding:16px}.view-panel h3{margin:0 0 4px}.note{font-size:13px;color:#666}@media(max-width:700px){.grid,.view-grid{grid-template-columns:1fr}.dot-grid{grid-template-columns:repeat(10,1fr)}}</style></head><body><main><a href="./">← Back to The Absolute Effect</a><div id="app"><div class="card">Loading evidence…</div></div><script>

function decodeBase64(s){const bin=atob(s.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function num(v){const n=Number(v);return Number.isFinite(n)?Math.abs(n):null}
function dots(value,type){const n=Math.min(100,Math.round(num(value)||0));let s='';for(let i=0;i<100;i++)s+='<span class="dot '+(i<n?(type==='b'?'b':'h'):'')+'"></span>';return s}
async function load(){const id=new URLSearchParams(location.search).get('id');const r=await fetch('https://api.github.com/repos/theabsoluteeffect/The-Absolute-Effect/git/blobs/'+OLD_BLOB);if(!r.ok)throw Error('Unable to load evidence data');const j=await r.json();const old=decodeBase64(j.content);const m=old.match(/const DATA=(.*?);const id=/s);if(!m)throw Error('Evidence dataset not found');const DATA=Function('return '+m[1])();const x=DATA[id]||FALLBACK[id];const app=document.getElementById('app');if(!x){app.innerHTML='<div class="card"><h1>Evidence entry not found</h1></div>';return}const b=num(x.absoluteBenefit),h=num(x.harmIncrease);const harmPositive=typeof x.harmIncrease==='number'?x.harmIncrease>0:(h!==null&&Number(x.harmIncrease)>0);app.innerHTML='<p class="eyebrow">'+x.site+' · '+x.discipline+' · '+x.setting+'</p><h1>'+x.trial+'</h1><p>'+ (x.clinicalQuestion||'')+'</p><div class="card"><h2>Trial at a glance</h2><p><b>Population:</b> '+(x.population||'Not reported')+'</p><p><b>Treatment:</b> '+(x.treatment||'Not reported')+'</p><p><b>Endpoint:</b> '+(x.endpoint||'Not reported')+'</p><p><b>Time horizon:</b> '+(x.horizon||'Not reported')+'</p></div><div class="card"><h2>Absolute Effect</h2><div class="grid"><div><div class="label">Benefit</div><div class="effect">'+(b===null?'Not quantifiable':b+' percentage points')+'</div><p>NNT: '+(x.nnt||'Not applicable')+'</p></div><div><div class="label">Harm</div><div class="effect">'+(!harmPositive||h===null?'Not quantifiable':h+' percentage points')+'</div><p>NNH: '+(x.nnH||'Not applicable')+'</p></div></div><p>'+ (x.benefitText||'')+'</p><div class="view-grid"><div class="view-panel"><h3>Benefit — 100 patients</h3><p class="note">'+(b===null?'Not quantifiable':b+' of 100 patients experience the displayed absolute benefit')+'</p><div class="dot-grid">'+dots(b,'b')+'</div></div><div class="view-panel"><h3>Additional harm — 100 patients</h3><p class="note">'+(!harmPositive||h===null?'Not quantifiable from the selected endpoint':h+' of 100 patients experience the displayed additional harm')+'</p><div class="dot-grid">'+dots(harmPositive?h:null,'h')+'</div></div></div><p class="note">Each dot represents one patient. The dark dots show the absolute benefit; the grey dots show additional harm. The two views are deliberately separated so benefit and harm are not visually conflated.</p></div><div class="card"><h2>Relative Effect</h2><p><b>'+ (x.relativeLabel||'Effect')+':</b> '+(x.relativeEffect||'Not reported')+'</p><p><b>Statistics:</b> '+(x.ci||'Not reported')+'</p></div><div class="card"><h2>Clinical interpretation</h2><p>'+ (x.benefitText||'')+'</p></div><div class="card"><h2>References</h2><ul>'+((x.refs||[]).map(r=>'<li>'+r+'</li>').join(''))+'</ul>'+((x.urls||[]).map(u=>'<p><a href="'+u+'" target="_blank" rel="noopener">Primary publication / source →</a></p>').join(''))+'</div>'}
