<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Entry | The Absolute Effect</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f7f7f5;color:#171717;line-height:1.55}main{max-width:920px;margin:auto;padding:30px 20px}.card{background:#fff;border:1px solid #e3e3df;border-radius:16px;padding:22px;margin:18px 0}.eyebrow,.label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.effect{font-size:30px;font-weight:850}.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:12px}.dot{aspect-ratio:1;border-radius:50%;background:#ddd}.dot.b{background:#171717}.dot.h{background:#777}.note{font-size:13px;color:#666}@media(max-width:700px){.grid{grid-template-columns:1fr}.dots{grid-template-columns:repeat(10,1fr)}}</style></head><body><main><a href="./">← Back to The Absolute Effect</a><div id="app"><div class="card">Loading evidence…</div></div><script>
const OLD_BLOB='a4164b904a791d2aac4407a421ac6e36d3430b1a';
function decodeBase64(s){const bin=atob(s.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function dots(b,h){let s='';const bn=Number.isFinite(b)?Math.round(Math.abs(b)):0,hn=Number.isFinite(h)?Math.round(Math.abs(h)):0;for(let i=0;i<100;i++)s+='<span class="dot '+(i<bn?'b':(i<bn+hn?'h':''))+'"></span>';return s}
async function load(){const id=new URLSearchParams(location.search).get('id');const r=await fetch('https://api.github.com/repos/theabsoluteeffect/The-Absolute-Effect/git/blobs/'+OLD_BLOB);if(!r.ok)throw Error('Unable to load evidence data');const j=await r.json();const old=decodeBase64(j.content);const m=old.match(/const DATA=(.*?);const id=/s);if(!m)throw Error('Evidence dataset not found');const DATA=Function('return '+m[1])();const x=DATA[id];const app=document.getElementById('app');if(!x){app.innerHTML='<div class="card"><h1>Evidence entry not found</h1></div>';return}const b=typeof x.absoluteBenefit==='number'?x.absoluteBenefit:null;const h=typeof x.harmIncrease==='number'&&x.harmIncrease>0?x.harmIncrease:null;app.innerHTML='<p class="eyebrow">'+x.site+' · '+x.discipline+' · '+x.setting+'</p><h1>'+x.trial+'</h1><p>'+ (x.clinicalQuestion||'')+'</p><div class="card"><h2>Trial at a glance</h2><p><b>Population:</b> '+(x.population||'Not reported')+'</p><p><b>Treatment:</b> '+(x.treatment||'Not reported')+'</p><p><b>Endpoint:</b> '+(x.endpoint||'Not reported')+'</p><p><b>Time horizon:</b> '+(x.horizon||'Not reported')+'</p></div><div class="card"><h2>Absolute Effect</h2><div class="grid"><div><div class="label">Benefit</div><div class="effect">'+(b===null?'Not quantifiable':Math.abs(b)+' percentage points')+'</div><p>NNT: '+(x.nnt||'Not applicable')+'</p></div><div><div class="label">Harm</div><div class="effect">'+(h===null?'Not quantifiable':h+' percentage points')+'</div><p>NNH: '+(x.nnH||'Not applicable')+'</p></div></div><p>'+ (x.benefitText||'')+'</p><div class="label">100-patient view</div><div class="dots">'+dots(b,h)+'</div><p class="note">Each dot represents one patient. Dark dots represent the absolute benefit; grey dots represent additional harm. The displayed effect is tied to the stated endpoint and time horizon.</p></div><div class="card"><h2>Relative Effect</h2><p><b>'+ (x.relativeLabel||'Effect')+':</b> '+(x.relativeEffect||'Not reported')+'</p><p><b>Statistics:</b> '+(x.ci||'Not reported')+'</p></div><div class="card"><h2>Clinical interpretation</h2><p>'+ (x.benefitText||'')+'</p></div><div class="card"><h2>References</h2><ul>'+((x.refs||[]).map(r=>'<li>'+r+'</li>').join(''))+'</ul>'+((x.urls||[]).map(u=>'<p><a href="'+u+'" target="_blank" rel="noopener">Primary publication / source →</a></p>').join(''))+'</div>'}
load().catch(e=>document.getElementById('app').innerHTML='<div class="card"><h1>Evidence entry could not be loaded</h1><p>'+e.message+'</p></div>');
</script></main></body></html>
