<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Entry | The Absolute Effect</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f7f7f5;color:#171717;line-height:1.55}main{max-width:900px;margin:auto;padding:36px 20px}.card{background:#fff;border:1px solid #e3e3df;border-radius:16px;padding:24px;margin:18px 0}.eyebrow,.label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.effect{font-size:30px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="./">← Back to The Absolute Effect</a><div id="app"></div><script>const DATA={"calgb-9343":{"id":"calgb-9343","site":"Breast Cancer","discipline":"Radiation Oncology","setting":"RT Omission","treatment":"Tamoxifen + RT vs tamoxifen alone after lumpectomy","population":"636 women ≥70 years, T1N0M0, ER-positive breast cancer","endpoint":"10-year freedom from locoregional recurrence","horizon":"10 years","interventionRate":98,"controlRate":90,"absoluteBenefit":8,"nnt":"13","relativeLabel":"HR","relativeEffect":"0.18","ci":"95% CI 0.07–0.42","n":636,"interventionN":317,"controlN":319,"benefitText":"RT reduced 10-year locoregional recurrence from about 10% to 2%, an absolute reduction of 8 percentage points (NNT 13). There was no significant difference in distant metastasis, breast-cancer-specific survival or overall survival. NNT is based on 10-year freedom from locoregional recurrence.","harmLabel":"RT-related toxicity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the reported endpoint; toxicity described in text","trial":"CALGB 9343","clinicalQuestion":"In women ≥70 with T1N0 ER-positive breast cancer after lumpectomy and endocrine therapy, can RT be omitted?","refs":["Hughes KS, et al. J Clin Oncol. 2013;31:2382–2387."],"urls":["https://pubmed.ncbi.nlm.nih.gov/23690420/"]},"prime-ii":{"id":"prime-ii","site":"Breast Cancer","discipline":"Radiation Oncology","setting":"RT Omission","treatment":"Whole-breast RT vs no RT after BCS + endocrine therapy","population":"1,326 women ≥65 years with low-risk HR-positive node-negative breast cancer","endpoint":"10-year local recurrence","horizon":"10 years","interventionRate":0.9,"controlRate":9.5,"absoluteBenefit":8.6,"nnt":"12","relativeLabel":"HR","relativeEffect":"10.4 for no RT vs RT","ci":"95% CI 4.1–26.1","n":1326,"interventionN":658,"controlN":668,"benefitText":"10-year local recurrence was 0.9% with RT versus 9.5% without RT, an absolute reduction of 8.6 percentage points (NNT 12). Overall survival was essentially identical, 80.7% vs 80.8%. NNT is based on 10-year local recurrence.","harmLabel":"Additional RT toxicity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the trial's main reported toxicity data","trial":"PRIME II","clinicalQuestion":"In older women with low-risk HR-positive node-negative breast cancer, what is the absolute benefit of adjuvant breast RT?","refs":["Kunkler IH, et al. N Engl J Med. 2023;388:585–594."],"urls":["https://www.nejm.org/doi/full/10.1056/NEJMoa2207586"]},"protect-15y":{"id":"protect-15y","site":"Prostate Cancer","discipline":"Surgical Oncology","setting":"Localized Disease","treatment":"Active monitoring vs prostatectomy vs radiotherapy","population":"1,643 men with clinically localized prostate cancer","endpoint":"Metastatic disease at 15 years","horizon":"15 years","interventionRate":4.7,"controlRate":9.4,"absoluteBenefit":4.7,"nnt":"21 for prostatectomy vs monitoring","relativeLabel":"HR","relativeEffect":"No significant difference in prostate-cancer mortality; metastases 4.7% vs 9.4% for prostatectomy vs monitoring","ci":"Cancer-specific mortality P=.53 overall","n":1643,"interventionN":553,"controlN":545,"benefitText":"At 15 years, prostate-cancer mortality was low and similar: 2.2% prostatectomy, 2.9% RT and 3.1% active monitoring. Metastases were less frequent after prostatectomy or RT than monitoring: 4.7%, 5.0% and 9.4%, respectively. NNT 21 refers specifically to prostatectomy vs monitoring for preventing one metastasis by 15 years, not death.","harmLabel":"Treatment morbidity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the selected endpoint; urinary, sexual and bowel harms reported separately","trial":"ProtecT","clinicalQuestion":"For localized prostate cancer, what are the long-term trade-offs between monitoring, surgery and radiotherapy?","refs":["Hamdy FC, et al. N Engl J Med. 2023;388:1547–1558."],"urls":["https://www.nejm.org/doi/full/10.1056/NEJMoa2214122"]},"chaarted":{"id":"chaarted","site":"Prostate Cancer","discipline":"Medical Oncology","setting":"Metastatic Hormone-Sensitive","treatment":"ADT + docetaxel vs ADT alone","population":"790 men with metastatic hormone-sensitive prostate cancer","endpoint":"Overall survival","horizon":"Median follow-up 53.7 months","interventionRate":57.6,"controlRate":47.2,"absoluteBenefit":10.4,"nnt":"Not appropriately calculable from median survival","relativeLabel":"HR","relativeEffect":"0.72","ci":"95% CI 0.59–0.89","n":790,"interventionN":397,"controlN":393,"benefitText":"Updated follow-up showed median OS 57.6 vs 47.2 months, a 10.4-month median difference, with HR 0.72. Benefit was greatest in high-volume disease. NNT is not derived from median survival because a reliable fixed-time absolute mortality estimate is not the appropriate basis here.","harmLabel":"Docetaxel treatment toxicity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the selected primary endpoint; febrile neutropenia and other chemotherapy toxicity reported in text","trial":"CHAARTED","clinicalQuestion":"In metastatic hormone-sensitive prostate cancer, does adding docetaxel to ADT improve survival?","refs":["Sweeney CJ, et al. N Engl J Med. 2015;373:737–746.","Kyriakopoulos CE, et al. J Clin Oncol. 2018;36:1080–1087."],"urls":["https://www.nejm.org/doi/full/10.1056/NEJMoa1503747","https://pmc.ncbi.nlm.nih.gov/articles/PMC5891129/"]},"eortc-30904":{"id":"eortc-30904","site":"Renal Cell Carcinoma","discipline":"Surgical Oncology","setting":"Localized Disease","treatment":"Nephron-sparing surgery vs radical nephrectomy","population":"541 patients with solitary ≤5 cm T1–T2 N0 M0 renal masses and a normal contralateral kidney","endpoint":"Overall survival","horizon":"10 years","interventionRate":75.7,"controlRate":81.1,"absoluteBenefit":-5.4,"nnt":"Not applicable; non-inferiority not demonstrated","relativeLabel":"HR","relativeEffect":"1.50 for NSS vs RN","ci":"95% CI 1.03–2.16; non-inferiority P=.77","n":541,"interventionN":268,"controlN":273,"benefitText":"In the ITT population, 10-year OS was 75.7% with nephron-sparing surgery vs 81.1% with radical nephrectomy. The trial did not establish non-inferiority. Only 12 of 117 deaths were renal-cancer deaths, and renal function was substantially better after NSS. This study should not be interpreted as evidence that partial nephrectomy is oncologically inferior in modern appropriately selected cT1 RCC.","harmLabel":"Moderate renal dysfunction","harmIntervention":64.7,"harmControl":85.7,"harmIncrease":-21,"nnH":"Not applicable; renal dysfunction favoured NSS","trial":"EORTC 30904","clinicalQuestion":"For small localized RCC, can nephron-sparing surgery preserve renal function without compromising cancer outcomes?","refs":["Van Poppel H, et al. Eur Urol. 2011;59:543–552.","Scosyrev E, et al. Eur Urol. 2014;65:372–377."],"urls":["https://pubmed.ncbi.nlm.nih.gov/21186077/","https://pubmed.ncbi.nlm.nih.gov/23850254/"]},"carmena":{"id":"carmena","site":"Renal Cell Carcinoma","discipline":"Surgical Oncology","setting":"Metastatic Disease","treatment":"Sunitinib alone vs cytoreductive nephrectomy followed by sunitinib","population":"450 patients with metastatic clear-cell RCC, MSKCC intermediate or poor risk","endpoint":"Overall survival","horizon":"Median follow-up 50.9 months","interventionRate":18.4,"controlRate":13.9,"absoluteBenefit":4.5,"nnt":"Not applicable; non-inferiority trial","relativeLabel":"NON-INFERIOR; HR","relativeEffect":"0.89","ci":"95% CI 0.71–1.10; NI margin 1.20","n":450,"interventionN":224,"controlN":226,"benefitText":"Sunitinib alone was non-inferior to nephrectomy followed by sunitinib for OS; median OS was 18.4 vs 13.9 months. The upper 95% CI of the HR remained below the prespecified NI margin of 1.20. This is a non-inferiority result, not proof that surgery is harmful or never useful.","harmLabel":"Major surgery burden","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the primary endpoint","trial":"CARMENA","clinicalQuestion":"In intermediate/poor-risk metastatic RCC, is upfront cytoreductive nephrectomy necessary before systemic therapy?","refs":["Méjean A, et al. N Engl J Med. 2018;379:417–427.","Méjean A, et al. Eur Urol. 2021;80:417–424."],"urls":["https://www.nejm.org/doi/full/10.1056/NEJMoa1803675","https://pubmed.ncbi.nlm.nih.gov/34187771/"]},"ba06-30894":{"id":"ba06-30894","site":"Bladder Cancer","discipline":"Medical Oncology","setting":"Neoadjuvant","treatment":"Three cycles CMV chemotherapy + definitive local therapy vs definitive local therapy alone","population":"976 patients with muscle-invasive urothelial bladder cancer","endpoint":"Overall survival","horizon":"10 years","interventionRate":36,"controlRate":30,"absoluteBenefit":6,"nnt":"17","relativeLabel":"HR","relativeEffect":"0.84","ci":"95% CI 0.72–0.99; P=.037","n":976,"interventionN":491,"controlN":485,"benefitText":"Neoadjuvant CMV increased 10-year OS from 30% to 36%, an absolute benefit of 6 percentage points (NNT 17). It also reduced metastasis or death. NNT is based on 10-year overall survival.","harmLabel":"Chemotherapy toxicity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the long-term publication; acute chemotherapy toxicity should be described rather than forcing an NNH","trial":"BA06 30894","clinicalQuestion":"Does neoadjuvant cisplatin-based chemotherapy improve survival before definitive local treatment of muscle-invasive bladder cancer?","refs":["International Collaboration of Trialists. J Clin Oncol. 2011;29:3513–3519."],"urls":["https://pubmed.ncbi.nlm.nih.gov/21502557/"]},"bc2001":{"id":"bc2001","site":"Bladder Cancer","discipline":"Radiation Oncology","setting":"Bladder Preservation","treatment":"Concurrent 5-FU + mitomycin C with RT vs RT alone","population":"360 patients with T2–T4a N0 M0 muscle-invasive bladder cancer","endpoint":"2-year locoregional disease-free survival","horizon":"2 years","interventionRate":71,"controlRate":58,"absoluteBenefit":13,"nnt":"8","relativeLabel":"HR","relativeEffect":"0.61","ci":"95% CI 0.42–0.90; P=.01","n":360,"interventionN":182,"controlN":178,"benefitText":"Concurrent chemotherapy improved 2-year locoregional disease-free survival from 58% to 71%, an absolute benefit of about 13 percentage points (NNT 8). At 10 years, locoregional control remained significantly better, while OS was not significantly different. NNT is based on 2-year locoregional disease-free survival.","harmLabel":"Grade 3–4 acute toxicity","harmIntervention":8.5,"harmControl":5.2,"harmIncrease":3.3,"nnH":"30","trial":"BC2001","clinicalQuestion":"For bladder-preserving RT, does concurrent chemotherapy improve locoregional control?","refs":["James ND, et al. N Engl J Med. 2012;366:1477–1488.","Huddart RA, et al. Eur Urol. 2022;82:183–192."],"urls":["https://www.nejm.org/doi/abs/10.1056/NEJMoa1106106","https://pubmed.ncbi.nlm.nih.gov/35577644/"]},"penile-dsnb-cno":{"id":"penile-dsnb-cno","site":"Penile Cancer","discipline":"Surgical Oncology","setting":"Nodal Staging","treatment":"Dynamic sentinel node biopsy-guided selective nodal dissection vs observation","population":"296 consecutive cN0 penile squamous-cell carcinoma patients","endpoint":"5-year cancer-specific survival","horizon":"5 years","interventionRate":85,"controlRate":77,"absoluteBenefit":8,"nnt":"Not defensible as a causal NNT; observational evidence","relativeLabel":"HR","relativeEffect":"Cancer death HR 0.29 after weighting","ci":"Retrospective cohort; treatment-selection bias possible","n":296,"interventionN":166,"controlN":114,"benefitText":"After inverse-probability weighting, 5-year cancer-specific survival was 90% with DSNB-guided selective dissection vs 77% with observation, while 5-year inguinal relapse-free survival was 90% vs 73%. Because this is nonrandomized evidence, the absolute difference should not be interpreted as a causal NNT. The key benefit is more accurate staging with less morbidity than prophylactic radical ILND.","harmLabel":"Clavien grade 3 complications","harmIntervention":0.6,"harmControl":12.5,"harmIncrease":-11.9,"nnH":"Not applicable; severe complications were lower with DSNB","trial":"Nazzani et al. cN0 penile cancer DSNB cohort","clinicalQuestion":"In cN0 penile cancer, can DSNB guide selective treatment of occult nodal disease while reducing morbidity?","refs":["Nazzani S, et al. J Urol. 2021;206:354–363."],"urls":["https://pubmed.ncbi.nlm.nih.gov/33843260/"]},"mrc-te19":{"id":"mrc-te19","site":"Germ Cell Tumours","discipline":"Medical Oncology","setting":"Stage I Seminoma","treatment":"Single-dose carboplatin vs adjuvant radiotherapy","population":"1,447 men with stage I seminoma after radical inguinal orchiectomy","endpoint":"5-year relapse-free rate","horizon":"5 years","interventionRate":94.7,"controlRate":96,"absoluteBenefit":-1.3,"nnt":"Not applicable; non-inferiority trial","relativeLabel":"NON-INFERIOR; HR","relativeEffect":"1.25 for relapse with carboplatin vs RT","ci":"90% CI 0.83–1.89; non-inferiority margin excluded a doubling of relapse risk","n":1447,"interventionN":573,"controlN":904,"benefitText":"Five-year relapse-free rate was 94.7% with single-dose carboplatin versus 96.0% with RT, an absolute difference of -1.3 percentage points. The trial established non-inferiority of carboplatin to RT for relapse control, not superiority. Carboplatin also reduced contralateral testicular GCTs (2 vs 15; HR 0.22). NNT is not appropriate because this is a non-inferiority comparison rather than a demonstrated absolute benefit.","harmLabel":"Treatment burden and fatigue","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the primary publication; carboplatin had less lethargy and less time off work than RT, while acute and late toxicities were otherwise reported descriptively","trial":"MRC TE19 / EORTC 30982","clinicalQuestion":"In stage I seminoma, can single-dose carboplatin replace adjuvant radiotherapy?","refs":["Oliver RT, et al. J Clin Oncol. 2011;29:957–962."],"urls":["https://pubmed.ncbi.nlm.nih.gov/21282539/"]},"german-ah01-94":{"id":"german-ah01-94","site":"Germ Cell Tumours","discipline":"Medical Oncology","setting":"Stage I Non-seminoma","treatment":"One cycle BEP vs nerve-sparing RPLND","population":"382 patients with clinical stage I non-seminomatous germ-cell tumours","endpoint":"Recurrence-free survival","horizon":"Mean follow-up 4.7 years","interventionRate":98.85,"controlRate":92.5,"absoluteBenefit":6.35,"nnt":"16","relativeLabel":"HR","relativeEffect":"Recurrence 1.15% vs 7.5%","ci":"P=.0033; tumour-specific survival 100% in both arms","n":382,"interventionN":174,"controlN":173,"benefitText":"One cycle of BEP produced fewer recurrences than RPLND in this randomized trial: 1.15% vs 7.5%, an absolute reduction of 6.35 percentage points (NNT 16). Tumour-specific survival was 100% in both groups. NNT is based on recurrence by approximately 4.7 years.","harmLabel":"Treatment-specific morbidity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the primary publication; RPLND carries operative morbidity while BEP carries chemotherapy-related toxicity","trial":"German Testicular Cancer Study Group AH 01/94","clinicalQuestion":"In stage I non-seminoma, does one cycle of BEP provide better disease control than RPLND?","refs":["Wittekind C, et al. Urologe A. 2008;47:1065–1070."],"urls":["https://pubmed.ncbi.nlm.nih.gov/19183929/"]},"swენoteca-stage1-nsgct":{"id":"swენoteca-stage1-nsgct","site":"Germ Cell Tumours","discipline":"Medical Oncology","setting":"Stage I Non-seminoma","treatment":"Risk-adapted surveillance vs one cycle adjuvant BEP","population":"745 patients with clinical stage I non-seminomatous germ-cell tumours in a prospective SWENOTECA programme","endpoint":"Relapse rate on surveillance according to vascular invasion","horizon":"Median follow-up 4.7 years","interventionRate":13.2,"controlRate":41.7,"absoluteBenefit":28.5,"nnt":"4 for adjuvant BEP if applied to the vascular-invasion-positive group","relativeLabel":"Risk stratification","relativeEffect":"Surveillance relapse 41.7% with vascular invasion vs 13.2% without","ci":"Prospective management programme; not a randomized comparison of BEP vs surveillance","n":745,"interventionN":0,"controlN":0,"benefitText":"SWENOTECA demonstrated why pathology matters in stage I NSGCT: among patients managed with surveillance, relapse was 41.7% with vascular invasion versus 13.2% without it. Mature follow-up of one-cycle BEP showed 5-year relapse rates of about 3.2% with vascular invasion and 1.6% without. This study supports risk-adapted management rather than a causal NNT because treatment allocation was not randomized. NNT is therefore not assigned as a trial-level causal estimate.","harmLabel":"One-cycle BEP toxicity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from this nonrandomized programme; chemotherapy burden should be discussed against relapse risk","trial":"SWENOTECA clinical stage I NSGCT management programme","clinicalQuestion":"Does vascular invasion identify patients with sufficiently high relapse risk to justify adjuvant BEP in stage I non-seminoma?","refs":["Tandstad T, et al. J Clin Oncol. 2009;27:2122–2128.","Tandstad T, et al. Ann Oncol. 2014;25:2167–2173."],"urls":["https://pubmed.ncbi.nlm.nih.gov/19307506/","https://pubmed.ncbi.nlm.nih.gov/25114021/"]},"mrc-te08":{"id":"mrc-te08","site":"Germ Cell Tumours","discipline":"Medical Oncology","setting":"Imaging","treatment":"Two CT scans vs five CT scans during surveillance","population":"414 patients with stage I NSGCT choosing surveillance","endpoint":"Intermediate/poor prognosis at relapse","horizon":"Median follow-up 40 months","interventionRate":0.8,"controlRate":0.6,"absoluteBenefit":0.2,"nnt":"Not applicable; non-inferiority/safety-of-reduced-imaging question","relativeLabel":"NON-INFERIOR; absolute difference","relativeEffect":"Intermediate-prognosis relapse 0.8% vs 0.6%","ci":"90% CI for difference -1.2% to 1.6%; no poor-prognosis relapses","n":414,"interventionN":247,"controlN":167,"benefitText":"Reducing surveillance CT from five to two did not materially increase the proportion of relapses presenting with intermediate or poor prognosis: 0.8% vs 0.6%, difference 0.2 percentage points. No poor-prognosis relapse occurred. This supports less intensive CT surveillance and illustrates an Imaging setting rather than a treatment-efficacy question.","harmLabel":"Radiation exposure from CT","harmIntervention":0.8,"harmControl":2,"harmIncrease":-1.2,"nnH":"Not applicable as a clinical harm NNH; the relevant harm is cumulative radiation exposure and scan burden","trial":"MRC TE08","clinicalQuestion":"Can CT imaging be safely reduced during surveillance of stage I non-seminoma?","refs":["Rustin GJ, et al. J Clin Oncol. 2007;25:1310–1315."],"urls":["https://pubmed.ncbi.nlm.nih.gov/17416851/"]},"getug-13":{"id":"getug-13","site":"Germ Cell Tumours","discipline":"Medical Oncology","setting":"Risk-adapted Treatment","treatment":"Tumour-marker decline guided dose-dense chemotherapy vs continued BEP in poor-prognosis NSGCT","population":"263 patients with IGCCCG poor-prognosis germ-cell tumours; 203 with unfavorable marker decline randomized","endpoint":"5-year progression-free survival","horizon":"Median follow-up 7.1 years","interventionRate":58.9,"controlRate":46.7,"absoluteBenefit":12.2,"nnt":"9","relativeLabel":"HR","relativeEffect":"0.65","ci":"95% CI 0.44–0.97; P=.036","n":263,"interventionN":105,"controlN":98,"benefitText":"Among patients with an unfavorable tumour-marker decline after one BEP cycle, switching to dose-dense intensified chemotherapy increased 5-year PFS from 46.7% to 58.9%, an absolute benefit of 12.2 points (NNT 9). Five-year OS was 70.9% vs 61.3%, HR 0.74, but this difference was not statistically significant. NNT is based on 5-year PFS.","harmLabel":"Grade 3 motor neurotoxicity at 1 year","harmIntervention":2.9,"harmControl":0,"harmIncrease":2.9,"nnH":"Not quantifiable from the reported time-specific toxicity denominator; intensified treatment caused more neurotoxicity and hematologic toxicity","trial":"GETUG-13","clinicalQuestion":"Can early tumour-marker decline identify poor-prognosis GCT patients who benefit from intensified chemotherapy?","refs":["Fizazi K, et al. J Clin Oncol. 2024;42:3270–3276.","Fizazi K, et al. Lancet Oncol. 2014;15:1442–1450."],"urls":["https://pubmed.ncbi.nlm.nih.gov/39167741/","https://pubmed.ncbi.nlm.nih.gov/25456363/"]},"mrc-te05":{"id":"mrc-te05","site":"Germ Cell Tumours","discipline":"Medical Oncology","setting":"Stage I Non-seminoma","treatment":"Two cycles adjuvant BEP in high-risk stage I NSGCT","population":"114 eligible patients with high-risk clinical stage I NSGCT","endpoint":"Relapse","horizon":"Median follow-up 4 years","interventionRate":1.9,"controlRate":25,"absoluteBenefit":23.1,"nnt":"5 if compared with historical surveillance risk; not a randomized NNT","relativeLabel":"Relapse rate","relativeEffect":"2 relapses among 104 histologically confirmed GCT patients","ci":"95% CI excluded a true relapse rate >5% in confirmed GCT","n":114,"interventionN":114,"controlN":0,"benefitText":"Two cycles of BEP produced very low relapse rates in this prospective high-risk stage I cohort: only one relapse among 104 patients confirmed to have GCT on central pathology review. The study was not randomized, so a causal NNT cannot be assigned. It established the effectiveness of short-course cisplatin-based adjuvant therapy in a high-risk population.","harmLabel":"Treatment-related toxicity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable as an NNH; one treatment-related cerebrovascular death occurred and pulmonary-function changes were monitored","trial":"MRC TE05","clinicalQuestion":"Can short-course BEP substantially reduce relapse in high-risk stage I non-seminoma?","refs":["Cullen MH, et al. J Clin Oncol. 1996;14:1093–1098."],"urls":["https://pubmed.ncbi.nlm.nih.gov/8648364/"]},"sakk-01-10":{"id":"sakk-01-10","site":"Germ Cell Tumours","discipline":"Radiation Oncology","setting":"Stage II Seminoma","treatment":"Single-dose carboplatin followed by involved-node RT","population":"116 eligible patients with stage IIA or IIB classic seminoma","endpoint":"3-year progression-free survival","horizon":"Median follow-up 4.5 years","interventionRate":93.7,"controlRate":0,"absoluteBenefit":93.7,"nnt":"Not applicable; single-arm phase II","relativeLabel":"Single-arm efficacy","relativeEffect":"3-year PFS 93.7%","ci":"90% CI 88.5–96.6; target 95% not met","n":116,"interventionN":116,"controlN":0,"benefitText":"A de-escalated regimen of one carboplatin cycle followed by involved-node RT achieved 93.7% 3-year PFS. The prespecified 95% target was not met, so this should be viewed as an investigational de-escalation strategy rather than proof of equivalence to standard RT or cisplatin-based chemotherapy. NNT is not applicable in a single-arm study.","harmLabel":"Grade 3–4 treatment-related toxicity","harmIntervention":8,"harmControl":0,"harmIncrease":8,"nnH":"Not applicable; single-arm study. Grade 3–4 events included neutropenia 4%, thrombocytopenia 3%, vomiting 1%","trial":"SAKK 01/10","clinicalQuestion":"Can stage IIA/IIB seminoma be treated with markedly de-escalated carboplatin plus involved-node RT?","refs":["Papachristofilou A, et al. Lancet Oncol. 2022;23:1441–1450."],"urls":["https://pubmed.ncbi.nlm.nih.gov/36228644/"]},"swog-8710":{"id":"swog-8710","site":"Bladder Cancer","discipline":"Medical Oncology","setting":"Neoadjuvant","treatment":"Neoadjuvant MVAC + radical cystectomy vs radical cystectomy alone","population":"307 evaluable patients with T2–T4a N0 M0 muscle-invasive bladder cancer","endpoint":"5-year overall survival","horizon":"Median follow-up about 8.5 years","interventionRate":57,"controlRate":43,"absoluteBenefit":14,"nnt":"8","relativeLabel":"HR","relativeEffect":"Death HR about 0.67","ci":"5-year OS P=.06; median OS 77 vs 46 months","n":307,"interventionN":153,"controlN":154,"benefitText":"Neoadjuvant MVAC increased 5-year OS from 43% to 57%, an absolute benefit of 14 percentage points (NNT 8), with median OS 77 vs 46 months. Pathologic complete response was 38% vs 15%. NNT is based on 5-year overall survival.","harmLabel":"Chemotherapy treatment burden","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantifiable from the long-term publication; acute MVAC toxicity should be reported in text","trial":"SWOG 8710","clinicalQuestion":"Does neoadjuvant cisplatin-based chemotherapy improve survival before cystectomy in muscle-invasive bladder cancer?","refs":["Grossman HB, et al. N Engl J Med. 2003;349:859–866."],"urls":["https://pubmed.ncbi.nlm.nih.gov/12944571/"]},"vesper":{"id":"vesper","site":"Bladder Cancer","discipline":"Medical Oncology","setting":"Neoadjuvant","treatment":"Dose-dense MVAC vs gemcitabine-cisplatin before cystectomy","population":"493 patients with localized muscle-invasive bladder cancer eligible for cisplatin-based neoadjuvant chemotherapy","endpoint":"5-year overall survival","horizon":"Long-term follow-up","interventionRate":71,"controlRate":66,"absoluteBenefit":5,"nnt":"20","relativeLabel":"HR","relativeEffect":"0.77 for event-free survival in bladder/lymph-node population; OS difference modest","ci":"Trial primarily demonstrated regimen differences in downstaging and event-free outcomes","n":493,"interventionN":248,"controlN":245,"benefitText":"VESPER established that dose-dense MVAC is a reasonable intensive neoadjuvant regimen, with higher pathologic response and favorable event-free outcomes compared with gemcitabine-cisplatin. Five-year OS was about 71% vs 66%, an absolute difference of 5 points (NNT 20), but the principal value of the trial is regimen selection rather than a large OS effect. NNT is based on 5-year OS.","harmLabel":"Grade 3–5 toxicity","harmIntervention":0,"harmControl":0,"harmIncrease":0,"nnH":"Not quantified here; ddMVAC has a different toxicity profile and requires growth-factor support","trial":"VESPER (GETUG-AFU V05 / COGB 0402)","clinicalQuestion":"Which cisplatin-based neoadjuvant regimen is preferable before cystectomy: ddMVAC or gemcitabine-cisplatin?","refs":["Pfister C, et al. Eur Urol. 2022;82:165–176."],"urls":["https://pubmed.ncbi.nlm.nih.gov/35256140/"]},"checkmate-274":{"id":"checkmate-274","site":"Bladder Cancer","discipline":"Medical Oncology","setting":"Adjuvant","treatment":"Adjuvant nivolumab vs placebo","population":"709 patients with high-risk muscle-invasive urothelial carcinoma after radical resection","endpoint":"Disease-free survival","horizon":"3-year follow-up","interventionRate":22,"controlRate":10.9,"absoluteBenefit":11.1,"nnt":"9 for median-event reduction interpretation; fixed-time NNT requires a specified landmark","relativeLabel":"HR","relativeEffect":"0.71","ci":"95% CI 0.58–0.86","n":709,"interventionN":353,"controlN":356,"benefitText":"At 3-year follow-up, median DFS was 22.0 months with nivolumab vs 10.9 months with placebo, HR 0.71. The original trial showed 6-month DFS 74.9% vs 6
