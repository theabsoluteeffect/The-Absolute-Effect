<style>
:root{--ink:#171717;--muted:#6b6b67;--line:#deded8;--paper:#fff;--wash:#f5f5f1;--soft:#fafaf8;--accent:#171717}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}a{color:inherit}main{max-width:1060px;margin:0 auto;padding:28px 22px 70px}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;color:var(--muted);margin-bottom:38px}.hero{padding:0 0 28px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 13px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.04em;margin:0 0 16px}.question{font-size:20px;line-height:1.45;max-width:820px;margin:0;color:#30302d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:24px 0}.stat{background:var(--paper);padding:18px}.label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.value{font-size:15px;font-weight:650;line-height:1.4}.section{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;margin:18px 0}.section h2{font-size:21px;letter-spacing:-.02em;margin:0 0 18px}.section p{margin:10px 0}.effect-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.effect{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:22px}.effect .number{font-size:34px;font-weight:850;letter-spacing:-.03em}.effect .small{font-size:13px;color:var(--muted);margin-top:5px}.effect p{margin:13px 0 0;font-size:14px}.interpretation{font-size:17px;line-height:1.6}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.subcard{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:20px}.subcard h3{margin:0 0 10px;font-size:15px}.subcard p{font-size:14px;margin:7px 0}.tag{display:inline-block;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 9px;font-size:12px;margin:0 5px 5px 0}.reference{padding:13px 0;border-top:1px solid var(--line);font-size:14px}.reference:first-child{border-top:0;padding-top:0}.primary{display:inline-block;margin-top:8px;text-decoration:none;font-weight:700}.primary:hover{text-decoration:underline}.note{font-size:13px;color:var(--muted)}@media(max-width:760px){main{padding:22px 16px 55px}.grid{grid-template-columns:1fr 1fr}.effect-grid,.two-col{grid-template-columns:1fr}.question{font-size:18px}.section{padding:21px}.hero h1{font-size:39px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.stat{padding:14px}}
</style>
</head>

<main>

<div id="app"><div class="section">Loading evidence…</div></div>
<script>
const DATA={
'nsabp-b18':{site:'Breast Cancer',discipline:'Medical Oncology',setting:'Neoadjuvant Therapy',trial:'NSABP B-18',question:'Does neoadjuvant chemotherapy improve surgical outcomes and disease control compared with postoperative chemotherapy in operable breast cancer?',population:'Women with operable breast cancer',intervention:'Doxorubicin + cyclophosphamide before surgery',comparator:'The same chemotherapy after surgery',endpoint:'Clinical/pathologic response, breast conservation and long-term survival',horizon:'Long-term follow-up',benefit:'Not expressed as a single survival percentage-point benefit',nnt:'Not appropriately calculable',harm:'Not quantified from a single prespecified patient-important toxicity endpoint',nnh:'Not appropriately calculable',relative:'Neoadjuvant treatment increased clinical and pathologic tumour response and breast-conservation rates; long-term overall survival was not improved by changing the timing of the same chemotherapy.',statistics:'See primary long-term NSABP B-18 publication',takeaway:'The major value of neoadjuvant chemotherapy in B-18 was surgical downstaging and the ability to observe treatment response in vivo. The trial did not show that giving the same chemotherapy before rather than after surgery improves overall survival.',refs:['Fisher B, et al. NSABP B-18 long-term follow-up, N Engl J Med.'],url:'https://pubmed.ncbi.nlm.nih.gov/22187279/'},
'nsabp-b27':{site:'Breast Cancer',discipline:'Medical Oncology',setting:'Neoadjuvant Therapy',trial:'NSABP B-27',question:'Does adding docetaxel to neoadjuvant doxorubicin plus cyclophosphamide improve response and disease outcomes?',population:'Women with operable breast cancer',intervention:'AC followed by docetaxel',comparator:'AC alone',endpoint:'Clinical and pathologic response and survival',horizon:'Long-term follow-up',benefit:'Response benefit; no single overall-population survival absolute benefit should be inferred from pCR alone',nnt:'Not appropriately calculable from the selected response endpoint',harm:'Treatment toxicity increased with additional chemotherapy',nnh:'Not appropriately calculable here',relative:'Adding docetaxel substantially increased tumour response and pathologic complete response, while survival benefit was not uniform across the randomized population.',statistics:'See primary publication',takeaway:'B-27 established the response benefit of adding docetaxel to preoperative AC, but response improvement should not be presented as equivalent to a universal survival benefit.',refs:['Bear HD, et al. NSABP B-27, J Clin Oncol.'],url:'https://pubmed.ncbi.nlm.nih.gov/17470848/'},
'getug-afu-16':{site:'Prostate Cancer',discipline:'Radiation Oncology',setting:'Salvage Radiotherapy',trial:'GETUG-AFU 16',question:'Does adding short-term ADT to salvage radiotherapy improve progression-free outcomes after prostatectomy biochemical recurrence?',population:'Men with biochemical recurrence after radical prostatectomy',intervention:'Salvage RT + 6 months ADT',comparator:'Salvage RT alone',endpoint:'Progression-free survival',horizon:'5 years',benefit:'≈18 percentage points',nnt:'6, based on 5-year progression-free survival',harm:'Not quantified on the same basis here',nnh:'Not quantified',relative:'5-year progression-free survival was approximately 80% versus 62%; HR approximately 0.52.',statistics:'95% CI approximately 0.40–0.67',takeaway:'Adding short-term ADT to salvage RT produced a clinically meaningful improvement in progression-free outcomes after biochemical recurrence.',refs:['Carrie C, et al. GETUG-AFU 16.'],url:'https://pubmed.ncbi.nlm.nih.gov/27160539/'},
'assure':{site:'Renal Cell Carcinoma',discipline:'Medical Oncology',setting:'Adjuvant',trial:'ASSURE',question:'Does adjuvant sunitinib or sorafenib improve disease-free or overall survival after nephrectomy for high-risk RCC?',population:'High-risk resected renal cell carcinoma',intervention:'Adjuvant sunitinib or sorafenib',comparator:'Placebo',endpoint:'Disease-free survival and overall survival',horizon:'Long-term follow-up',benefit:'No convincing DFS or OS benefit demonstrated',nnt:'Not applicable',harm:'Treatment added toxicity and treatment burden',nnh:'Not quantified here',relative:'Neither sunitinib nor sorafenib produced a convincing disease-free or overall-survival advantage.',statistics:'See primary ASSURE publication',takeaway:'ASSURE is an important negative adjuvant trial: increased treatment intensity did not translate into better survival outcomes.',refs:['Haas NB, et al. ASSURE, Lancet.'],url:'https://pubmed.ncbi.nlm.nih.gov/24411151/'},
'everest':{site:'Renal Cell Carcinoma',discipline:'Medical Oncology',setting:'Adjuvant',trial:'EVEREST',question:'Does adjuvant everolimus reduce recurrence after nephrectomy for high-risk RCC?',population:'High-risk RCC after nephrectomy',intervention:'Everolimus for 54 weeks',comparator:'Placebo',endpoint:'Recurrence-free survival',horizon:'5 years',benefit:'≈4 percentage points',nnt:'25, based on the approximate 5-year RFS difference',harm:'≈35 percentage points increase in grade ≥3 toxicity',nnh:'≈3, based on the reported toxicity difference',relative:'5-year recurrence-free survival was approximately 67% versus 63%; HR 0.85.',statistics:'95% CI 0.72–1.00; p=.051',takeaway:'EVEREST narrowly missed its prespecified significance threshold in the overall population. The modest recurrence signal must be weighed against substantial treatment toxicity.',refs:['Ryan CW, et al. EVEREST, Lancet.'],url:'https://pubmed.ncbi.nlm.nih.gov/36931123/'},
'eortc-30986':{site:'Bladder Cancer',discipline:'Medical Oncology',setting:'Advanced/Metastatic',trial:'EORTC 30986',question:'Does gemcitabine-cisplatin provide similar efficacy with less severe toxicity than M-CAVI?',population:'Advanced or metastatic urothelial carcinoma',intervention:'Gemcitabine + cisplatin',comparator:'M-CAVI',endpoint:'Objective response and overall survival',horizon:'During treatment / median survival',benefit:'10.9 percentage points in objective response',nnt:'9, based on objective response',harm:'Severe acute toxicity favoured gemcitabine-cisplatin',nnh:'Not applicable',relative:'Objective response was 41.2% versus 30.3%; median OS was 9.3 versus 8.1 months.',statistics:'See primary publication',takeaway:'Gemcitabine-cisplatin provided similar efficacy with a more favourable severe-toxicity profile than M-CAVI.',refs:['De Santis M, et al. EORTC 30986.'],url:'https://pubmed.ncbi.nlm.nih.gov/19139447/'},
'javelin-bladder-100':{site:'Bladder Cancer',discipline:'Medical Oncology',setting:'Maintenance Metastatic',trial:'JAVELIN Bladder 100',question:'Does maintenance avelumab after first-line platinum chemotherapy improve survival in advanced urothelial carcinoma?',population:'Advanced urothelial carcinoma without progression after first-line platinum chemotherapy',intervention:'Avelumab maintenance + best supportive care',comparator:'Best supportive care alone',endpoint:'Overall survival',horizon:'Long-term follow-up',benefit:'≈7 percentage points at the reported median OS comparison',nnt:'Not presented as a fixed-time NNT here',harm:'Immune-related and treatment-related toxicity increased',nnh:'Not quantified here',relative:'Median OS was approximately 21.4 versus 14.3 months; HR approximately 0.69.',statistics:'See primary publication',takeaway:'Maintenance avelumab after response or stable disease following platinum chemotherapy produces a substantial survival improvement and established a new maintenance standard.',refs:['Powles T, et al. JAVELIN Bladder 100.'],url:'https://pubmed.ncbi.nlm.nih.gov/34171388/'},
'penile-adjuvant-5fu-vs-paclitaxel':{site:'Penile Cancer',discipline:'Medical Oncology',setting:'Adjuvant High-Risk Node-Positive',trial:'Adjuvant paclitaxel-platinum versus 5-FU-platinum',question:'In high-risk node-positive penile SCC, does paclitaxel-platinum provide comparable efficacy with lower toxicity?',population:'49 men with resected node-positive penile SCC and high-risk features',intervention:'Paclitaxel-platinum',comparator:'5-FU-platinum',endpoint:'DFS, OS and grade ≥3 toxicity',horizon:'Median follow-up 69 months',benefit:'Efficacy difference not reliably quantifiable because the study was stopped early',nnt:'Not applicable; underpowered for efficacy',harm:'36.4 percentage-point reduction in grade ≥3 toxicity',nnh:'Not an NNH for harm; this is an absolute toxicity reduction',relative:'DFS HR 1.16 and OS HR 1.13, both non-significant. Grade ≥3 toxicity was 40.9% versus 77.3%.',statistics:'The trial was underpowered for definitive efficacy conclusions.',takeaway:'Paclitaxel-platinum showed a strong tolerability advantage, but this trial does not establish equivalence or superiority for survival and should not be interpreted as proving paclitaxel-platinum is preferable to TIP or another neoadjuvant standard.',refs:['Primary publication, 2026 randomized penile cancer trial.'],url:'https://pubmed.ncbi.nlm.nih.gov/42636270/'},
'mrc-eortc-bep-vs-ceb':{site:'Germ Cell Tumours',discipline:'Medical Oncology',setting:'Good-Risk Metastatic NSGCT',trial:'MRC/EORTC BEP vs CEB',question:'Can BEP provide superior disease control and survival compared with CEB in good-risk metastatic NSGCT?',population:'Good-risk metastatic NSGCT',intervention:'Four cycles BEP',comparator:'Four cycles CEB',endpoint:'Failure-free and overall survival',horizon:'Long-term follow-up',benefit:'≈7 percentage points in 3-year survival',nnt:'14, based on the approximate 3-year survival difference',harm:'Not quantified here',nnh:'Not quantified',relative:'Approximately 3-year survival was 97% versus 90%, with better disease control for BEP.',statistics:'See primary randomized publication',takeaway:'BEP produced better disease control and survival than CEB and became the preferred regimen for good-risk metastatic NSGCT.',refs:['MRC/EORTC randomized BEP versus CEB trial.'],url:''}
};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(x){document.title=x.trial+' | The Absolute Effect';const app=document.getElementById('app');app.innerHTML=`<header class="hero"><p class="eyebrow">${esc(x.site)} · ${esc(x.discipline)} · ${esc(x.setting)}</p><h1>${esc(x.trial)}</h1><p class="question">${esc(x.question)}</p></header><div class="grid"><div class="stat"><div class="label">Population</div><div class="value">${esc(x.population)}</div></div><div class="stat"><div class="label">Intervention</div><div class="value">${esc(x.intervention)}</div></div><div class="stat"><div class="label">Comparator</div><div class="value">${esc(x.comparator)}</div></div><div class="stat"><div class="label">Primary endpoint</div><div class="value">${esc(x.endpoint)}</div></div></div><section class="section"><h2>Absolute Effect</h2><div class="effect-grid"><div class="effect"><div class="label">Benefit</div><div class="number">${esc(x.benefit)}</div><div class="small">Time horizon: ${esc(x.horizon)}</div><p><strong>NNT:</strong> ${esc(x.nnt)}</p></div><div class="effect"><div class="label">Harm / treatment burden</div><div class="number">${esc(x.harm)}</div><div class="small">Same clinical context as reported above</div><p><strong>NNH:</strong> ${esc(x.nnh)}</p></div></div></section><section class="section"><h2>What the trial actually showed</h2><div class="two-col"><div class="subcard"><h3>Relative effect</h3><p>${esc(x.relative)}</p><p class="note">${esc(x.statistics)}</p></div><div class="subcard"><h3>Clinical interpretation</h3><p>${esc(x.takeaway)}</p></div></div></section><section class="section"><h2>Clinical takeaway</h2><p class="interpretation">${esc(x.takeaway)}</p></section><section class="section"><h2>Primary publication</h2>${x.refs.map(r=>`<div class="reference">${esc(r)}</div>`).join('')}${x.url?`<a class="primary" href="${esc(x.url)}" target="_blank" rel="noopener">Open primary publication / source →</a>`:''}</section>`}
const id=new URLSearchParams(location.search).get('id');const x=DATA[id];if(x)render(x);else document.getElementById('app').innerHTML='<section class="section"><h1>Evidence entry not found</h1><p>The requested trial could not be found.</p></section>';
</script>
</main>
