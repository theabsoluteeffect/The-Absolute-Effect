<title>Evidence Entry | The Absolute Effect</title>
<style>
:root{--ink:#171717;--muted:#666660;--line:#deded8;--paper:#fff;--wash:#f5f5f1;--soft:#fafaf8}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}a{color:inherit}main{max-width:1080px;margin:0 auto;padding:28px 22px 70px}.back{display:inline-flex;text-decoration:none;font-size:14px;color:var(--muted);margin-bottom:38px}.hero{padding:0 0 28px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 13px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.04em;margin:0 0 16px}.question{font-size:20px;line-height:1.45;max-width:850px;margin:0;color:#30302d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:24px 0}.stat{background:var(--paper);padding:18px}.label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.value{font-size:15px;font-weight:650;line-height:1.4}.section{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;margin:18px 0}.section h2{font-size:21px;letter-spacing:-.02em;margin:0 0 18px}.section p{margin:10px 0}.effect-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.effect{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:22px}.effect .number{font-size:30px;font-weight:850;letter-spacing:-.03em}.effect .small{font-size:13px;color:var(--muted);margin-top:5px}.effect p{margin:13px 0 0;font-size:14px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.subcard{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:20px}.subcard h3{margin:0 0 10px;font-size:15px}.subcard p{font-size:14px;margin:7px 0}.interpretation{font-size:17px;line-height:1.6}.reference{padding:13px 0;border-top:1px solid var(--line);font-size:14px}.reference:first-child{border-top:0;padding-top:0}.primary{display:inline-block;margin-top:8px;text-decoration:none;font-weight:700}.note{font-size:13px;color:var(--muted)}@media(max-width:760px){main{padding:22px 16px 55px}.grid{grid-template-columns:1fr 1fr}.effect-grid,.two-col{grid-template-columns:1fr}.question{font-size:18px}.section{padding:21px}.hero h1{font-size:39px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.stat{padding:14px}}
</style>
</head>
<body><main>
<a class="back" href="./">← Back to The Absolute Effect</a><div id="app"><div class="section">Loading evidence…</div></div>
<script>
const DATA={
'nsabp-b18':{site:'Breast Cancer',discipline:'Medical Oncology',setting:'Neoadjuvant Therapy',trial:'NSABP B-18',question:'Does neoadjuvant chemotherapy improve surgical outcomes and disease control compared with postoperative chemotherapy in operable breast cancer?',population:'1,523 women with operable breast cancer',intervention:'Doxorubicin + cyclophosphamide before surgery',comparator:'The same chemotherapy after surgery',endpoint:'Tumour response, breast conservation, nodal status and long-term survival',horizon:'9-year and long-term follow-up',benefit:'Breast conservation: 68% vs 60% (+8 pp)',nnt:'13, based on the 8-point increase in breast-conserving surgery',harm:'No clinically central randomized toxicity endpoint reported as the principal comparison',nnh:'Not appropriately calculable',relative:'Tumour size decreased in 80% and 36% achieved a clinical complete response. pCR was 13% among patients receiving neoadjuvant AC; this is a treatment-arm rate, not a randomized absolute benefit. Pathologically negative axillary nodes were 57% vs 41% (+16 pp). Breast conservation was 68% vs 60% (+8 pp).',statistics:'9-year OS: 69% vs 70%, P=.80. 9-year DFS: 55% vs 53%, P=.50. Long-term survival remained equivalent.',takeaway:'The measurable benefit of neoadjuvant AC was downstaging: more tumours responded, more axillae became pathologically node-negative, and breast conservation increased by 8 percentage points. Moving the same chemotherapy before surgery did not improve long-term survival.',refs:['Fisher B, et al. NSABP B-18 long-term results. J Natl Cancer Inst. 2002.','Fisher B, et al. Local-regional effects of preoperative chemotherapy in NSABP B-18. J Clin Oncol. 1997.'],url:'https://pubmed.ncbi.nlm.nih.gov/11773300/'},
'nsabp-b27':{site:'Breast Cancer',discipline:'Medical Oncology',setting:'Neoadjuvant Therapy',trial:'NSABP B-27',question:'Does adding docetaxel to neoadjuvant doxorubicin plus cyclophosphamide improve tumour response and disease outcomes?',population:'2,411 women with operable breast cancer',intervention:'Preoperative AC followed by docetaxel',comparator:'Preoperative AC alone; docetaxel was also tested after surgery in a third arm',endpoint:'Clinical response, pCR, nodal downstaging, breast conservation, DFS and OS',horizon:'Long-term follow-up',benefit:'pCR: 26.1% vs 13.7% (+12.4 pp)',nnt:'9, based on the approximate 12.4-point increase in pCR',harm:'Grade 3-4 toxicity: approximately 40% vs 23% in the neoadjuvant AC vs AC-docetaxel comparison',nnh:'Not calculated from this toxicity comparison because the published endpoint definitions and analysis differ from a single standardized NNH endpoint',relative:'Clinical response was 90.7% vs 85.5%; clinical complete response 63.6% vs 40.1%; pathologically negative axillary nodes 58.2% vs 50.8%; and pCR 26.1% vs 13.7% with preoperative docetaxel versus AC alone. Breast conservation was 63.7% vs 61.6%, not significantly different.',statistics:'5-year DFS was approximately 71.1% with neoadjuvant docetaxel versus 67.7% with AC alone; HR 0.90, 95% CI 0.76–1.06, P=.22. No significant OS improvement.',takeaway:'B-27 clearly improved response and pCR with preoperative docetaxel, but the approximately 12-point pCR increase did not translate into a statistically significant overall survival benefit. Breast conservation itself was not significantly increased.',refs:['Bear HD, et al. Sequential preoperative or postoperative docetaxel added to preoperative AC: NSABP B-27. J Clin Oncol. 2006.','Rastogi P, et al. NSABP B-18/B-27 update. J Clin Oncol. 2008.'],url:'https://pubmed.ncbi.nlm.nih.gov/17470848/'},
'getug-afu-16':{site:'Prostate Cancer',discipline:'Radiation Oncology',setting:'Salvage Radiotherapy',trial:'GETUG-AFU 16',question:'Does adding short-term ADT to salvage radiotherapy improve progression-free outcomes after prostatectomy biochemical recurrence?',population:'743 men with biochemical recurrence after radical prostatectomy',intervention:'Salvage RT + 6 months goserelin',comparator:'Salvage RT alone',endpoint:'Progression-free survival',horizon:'5 and 10 years',benefit:'5-year PFS: 80% vs 62% (+18 pp)',nnt:'6, based on 5-year progression-free survival',harm:'Grade ≥2 hot flushes/sweating: 8% vs 0%; grade ≥3 hot flushes: 8% vs 0%',nnh:'13, approximately, for grade ≥2 hot flushes/sweating',relative:'At 5 years, progression-free survival was 80% vs 62%, HR 0.50 (95% CI 0.38–0.66). At 120 months, PFS was 64% vs 49%, HR 0.54 (95% CI 0.43–0.68).',statistics:'Median follow-up for the long-term analysis: 112 months. No overall-survival benefit was demonstrated.',takeaway:'Adding 6 months of ADT to salvage RT produced a durable progression-free benefit, with an 18-point absolute improvement at 5 years. The main added burden was hormonal toxicity rather than excess late serious RT toxicity.',refs:['Carrie C, et al. GETUG-AFU 16. Lancet Oncol. 2016.','Carrie C, et al. GETUG-AFU 16 long-term follow-up. Lancet Oncol. 2019.'],url:'https://pubmed.ncbi.nlm.nih.gov/27160539/'},
'assure':{site:'Renal Cell Carcinoma',discipline:'Medical Oncology',setting:'Adjuvant',trial:'ASSURE',question:'Does adjuvant sunitinib or sorafenib improve disease-free or overall survival after nephrectomy for high-risk RCC?',population:'1,943 patients with high-risk resected RCC',intervention:'Adjuvant sunitinib or sorafenib for up to 1 year',comparator:'Placebo',endpoint:'Disease-free survival and overall survival',horizon:'5-year outcomes; median follow-up 5.8 years',benefit:'5-year DFS: 54.3% sunitinib, 54.0% sorafenib, 56.4% placebo',nnt:'Not applicable; treatment did not improve DFS',harm:'Grade ≥3 adverse events: 63% sunitinib, 70% sorafenib, 24% placebo',nnh:'3 for sunitinib and 2 for sorafenib, approximately, versus placebo for grade ≥3 toxicity',relative:'Median DFS was 5.8 years with sunitinib, 6.1 years with sorafenib and 6.6 years with placebo. HR vs placebo: 1.02 for sunitinib and 0.97 for sorafenib.',statistics:'5-year OS: 77.9% sunitinib, 80.5% sorafenib, 80.3% placebo. No survival benefit.',takeaway:'ASSURE is a clear negative adjuvant trial. Neither VEGF-TKI improved DFS or OS, while grade ≥3 toxicity increased markedly compared with placebo.',refs:['Haas NB, et al. Adjuvant sunitinib or sorafenib for high-risk RCC: E2805/ASSURE. Lancet. 2016.'],url:'https://pubmed.ncbi.nlm.nih.gov/26945729/'},
'everest':{site:'Renal Cell Carcinoma',discipline:'Medical Oncology',setting:'Adjuvant',trial:'EVEREST',question:'Does adjuvant everolimus reduce recurrence after nephrectomy for high-risk RCC?',population:'1,545 randomized patients with intermediate-high or very-high risk RCC',intervention:'Everolimus 10 mg daily for 54 weeks',comparator:'Placebo',endpoint:'Recurrence-free survival',horizon:'5 years; median follow-up 76 months',benefit:'5-year RFS: 67% vs 63% (+4 pp)',nnt:'25, based on the 4-point 5-year RFS difference; interpret cautiously because P=.051',harm:'Grade ≥3 adverse events: 46% vs 11% (+35 pp)',nnh:'3, approximately, for grade ≥3 adverse events',relative:'RFS HR 0.85 (95% CI 0.72–1.00), P=.051. Very-high-risk subgroup HR 0.79 (95% CI 0.65–0.97), P=.022.',statistics:'The prespecified significance threshold was P=.044, so the overall primary endpoint was not statistically significant.',takeaway:'EVEREST produced a small absolute recurrence-free survival difference but narrowly missed its prespecified significance threshold. The 35-point increase in grade ≥3 adverse events is a major counterweight.',refs:['Ryan CW, et al. Adjuvant everolimus after surgery for RCC: EVEREST. Lancet. 2023.'],url:'https://pubmed.ncbi.nlm.nih.gov/37524096/'},
'sorce':{site:'Renal Cell Carcinoma',discipline:'Medical Oncology',setting:'Adjuvant',trial:'SORCE',question:'Does adjuvant sorafenib reduce recurrence or improve survival after nephrectomy for intermediate- or high-risk RCC?',population:'1,711 patients with intermediate- or high-risk resected RCC',intervention:'Sorafenib for 1 or 3 years',comparator:'Placebo',endpoint:'Disease-free survival and overall survival',horizon:'Median follow-up 6.5 years; 10-year estimates',benefit:'10-year DFS: 53% with 3-year sorafenib vs 54% placebo',nnt:'Not applicable; no DFS benefit demonstrated',harm:'Grade 3 hand-foot skin reaction: 24% with sorafenib',nnh:'Not calculated because the published toxicity endpoint is not a single randomized all-grade harm endpoint',relative:'3-year sorafenib vs placebo: DFS HR 1.01 (95% CI 0.82–1.23), P=.946. RMST difference 0.01 year. 10-year DFS 53% vs 54%.',statistics:'10-year OS: 70% with 3-year sorafenib vs 69% placebo. More than half stopped treatment by 12 months despite treatment adaptations.',takeaway:'SORCE found no clinically meaningful DFS or OS benefit from adjuvant sorafenib, while treatment burden and toxicity were substantial.',refs:['Eisen T, et al. Adjuvant sorafenib for RCC at intermediate or high risk: SORCE. J Clin Oncol. 2020.'],url:'https://pubmed.ncbi.nlm.nih.gov/33052759/'},
'eortc-30986':{site:'Bladder Cancer',discipline:'Medical Oncology',setting:'Advanced/Metastatic',trial:'EORTC 30986',question:'In cisplatin-unfit advanced urothelial carcinoma, does gemcitabine-carboplatin provide similar efficacy with less severe toxicity than M-CAVI?',population:'238 chemotherapy-naive patients unfit for cisplatin',intervention:'Gemcitabine + carboplatin',comparator:'M-CAVI: methotrexate + carboplatin + vinblastine',endpoint:'Overall survival, response and severe acute toxicity',horizon:'Median follow-up 4.5 years',benefit:'Objective response: 41.2% vs 30.3% (+10.9 pp)',nnt:'9, based on objective response',harm:'Severe acute toxicity: 9.3% vs 21.2% (−11.9 pp)',nnh:'9, approximately, for avoiding severe acute toxicity with gemcitabine-carboplatin',relative:'Median OS was 9.3 vs 8.1 months, P=.64. Confirmed response was 36.1% vs 21.0%. PFS did not differ, P=.78.',statistics:'The trial did not demonstrate a significant efficacy advantage; the important result was the lower severe acute toxicity with gemcitabine-carboplatin.',takeaway:'EORTC 30986 did not show superior survival, but gemcitabine-carboplatin had a clinically meaningful reduction in severe acute toxicity and became an important option for cisplatin-unfit patients.',refs:['De Santis M, et al. EORTC 30986. J Clin Oncol. 2012.'],url:'https://pubmed.ncbi.nlm.nih.gov/22162575/'},
'javelin-bladder-100':{site:'Bladder Cancer',discipline:'Medical Oncology',setting:'Maintenance Metastatic',trial:'JAVELIN Bladder 100',question:'Does maintenance avelumab after first-line platinum chemotherapy improve survival in advanced urothelial carcinoma?',population:'700 patients with advanced urothelial carcinoma without progression after first-line platinum chemotherapy',intervention:'Avelumab maintenance + best supportive care',comparator:'Best supportive care alone',endpoint:'Overall survival',horizon:'1-year landmark and median follow-up',benefit:'1-year OS: 71.3% vs 58.4% (+12.9 pp)',nnt:'8, based on 1-year overall survival',harm:'Grade ≥3 adverse events: 47.4% vs 25.2% (+22.2 pp)',nnh:'5, approximately, for grade ≥3 adverse events',relative:'Median OS was 21.4 vs 14.3 months; HR 0.69 (95% CI 0.56–0.86). Median PFS was 3.7 vs 2.0 months; HR 0.62.',statistics:'The survival benefit was demonstrated in the overall randomized population, not only the PD-L1-positive subgroup.',takeaway:'Avelumab maintenance produced a large early absolute survival benefit after first-line platinum chemotherapy, at the cost of increased treatment-related toxicity. This established maintenance immunotherapy as a standard strategy.',refs:['Powles T, et al. Avelumab maintenance therapy for advanced or metastatic urothelial carcinoma. N Engl J Med. 2020.'],url:'https://pubmed.ncbi.nlm.nih.gov/32945632/'},
'penile-adjuvant-5fu-vs-paclitaxel':{site:'Penile Cancer',discipline:'Medical Oncology',setting:'Adjuvant High-Risk Node-Positive',trial:'Adjuvant paclitaxel-platinum versus 5-FU-platinum',question:'In high-risk node-positive penile SCC, does paclitaxel-platinum provide comparable efficacy with lower toxicity?',population:'49 men with resected node-positive penile SCC and at least one high-risk feature',intervention:'Paclitaxel-platinum followed by cisplatin-based chemoradiotherapy',comparator:'5-FU-platinum followed by cisplatin-based chemoradiotherapy',endpoint:'DFS, OS, toxicity and quality of life',horizon:'Median follow-up 69 months',benefit:'Median DFS: 19.6 vs 12.4 months; median OS: 36.7 vs 21.3 months',nnt:'Not calculable; early termination precluded a definitive efficacy comparison',harm:'Grade ≥3 toxicity: 40.9% vs 77.3% (−36.4 pp)',nnh:'Not an NNH for harm; this is an absolute toxicity reduction',relative:'DFS HR 1.16 (95% CI 0.55–2.45), P=.686. OS HR 1.13 (95% CI 0.52–2.44), P=.754. Grade ≥3 hematologic toxicity: 4.5% vs 54.5%. Hospitalization for toxicity: 9.1% vs 45.5%.',statistics:'Completion of all planned cycles: 83.3% vs 48.0%, P=.009. Early termination prevented definitive efficacy conclusions.',takeaway:'Paclitaxel-platinum showed a strong and quantifiable tolerability advantage, but the study was too small and stopped early. It does not establish equivalence or superiority for survival and should not be interpreted as proving superiority over TIP in the neoadjuvant setting.',refs:['Randomized trial of adjuvant 5-FU-platinum vs paclitaxel-platinum for high-risk penile cancer. JNCI. 2026.'],url:'https://pubmed.ncbi.nlm.nih.gov/42636270/'},
'mrc-eortc-bep-vs-ceb':{site:'Germ Cell Tumours',discipline:'Medical Oncology',setting:'Good-Risk Metastatic NSGCT',trial:'MRC/EORTC BEP vs CEB',question:'Does BEP provide superior disease control and survival compared with CEB in good-risk metastatic nonseminomatous germ cell cancer?',population:'598 patients with good-risk metastatic nonseminomatous germ cell cancer',intervention:'Four cycles BEP',comparator:'Four cycles CEB',endpoint:'Complete response, failure-free survival and overall survival',horizon:'1-year failure-free and 3-year survival',benefit:'1-year failure-free survival: 91% vs 77% (+14 pp); 3-year OS: 97% vs 90% (+7 pp)',nnt:'15 for 1-year failure-free survival; 14 for 3-year overall survival',harm:'Not expressed as a single comparable toxicity endpoint on this page',nnh:'Not appropriately calculable',relative:'Complete response was 94.4% vs 87.3% (+7.1 pp; P=.009). There were 30 vs 79 treatment failures (P<.001).',statistics:'3-year survival: 97% vs 90%, P=.003. The trial demonstrated inferiority of carboplatin-containing CEB.',takeaway:'BEP produced materially better disease control and survival than CEB. The 7-point 3-year survival difference corresponds to an approximate NNT of 14 and established cisplatin-containing BEP as the preferred regimen for good-risk metastatic NSGCT.',refs:['Horwich A, et al. MRC/EORTC randomized BEP versus CEB trial. J Clin Oncol. 1997.'],url:'https://pubmed.ncbi.nlm.nih.gov/9164194/'}
};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(x){document.title=x.trial+' | The Absolute Effect';const app=document.getElementById('app');app.innerHTML=`<header class="hero"><p class="eyebrow">${esc(x.site)} · ${esc(x.discipline)} · ${esc(x.setting)}</p><h1>${esc(x.trial)}</h1><p class="question">${esc(x.question)}</p></header><div class="grid"><div class="stat"><div class="label">Population</div><div class="value">${esc(x.population)}</div></div><div class="stat"><div class="label">Intervention</div><div class="value">${esc(x.intervention)}</div></div><div class="stat"><div class="label">Comparator</div><div class="value">${esc(x.comparator)}</div></div><div class="stat"><div class="label">Primary endpoint</div><div class="value">${esc(x.endpoint)}</div></div></div><section class="section"><h2>Absolute Effect</h2><div class="effect-grid"><div class="effect"><div class="label">Benefit</div><div class="number">${esc(x.benefit)}</div><div class="small">Time horizon: ${esc(x.horizon)}</div><p><strong>NNT:</strong> ${esc(x.nnt)}</p></div><div class="effect"><div class="label">Harm / treatment burden</div><div class="number">${esc(x.harm)}</div><div class="small">Use the exact trial endpoint rather than a generic toxicity label</div><p><strong>NNH:</strong> ${esc(x.nnh)}</p></div></div></section><section class="section"><h2>What the trial actually showed</h2><div class="two-col"><div class="subcard"><h3>Relative effect and absolute results</h3><p>${esc(x.relative)}</p><p class="note">${esc(x.statistics)}</p></div><div class="subcard"><h3>Clinical interpretation</h3><p>${esc(x.takeaway)}</p></div></div></section><section class="section"><h2>Clinical takeaway</h2><p class="interpretation">${esc(x.takeaway)}</p></section><section class="section"><h2>Primary publication</h2>${x.refs.map(r=>`<div class="reference">${esc(r)}</div>`).join('')}${x.url?`<a class="primary" href="${esc(x.url)}" target="_blank" rel="noopener">Open primary publication / source →</a>`:''}</section>`}
const id=new URLSearchParams(location.search).get('id');const x=DATA[id];if(x)render(x);else document.getElementById('app').innerHTML='<section class="section"><h1>Evidence entry not found</h1><p>The requested trial could not be found.</p></section>';
</script></main></body></html>
