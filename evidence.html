<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Evidence Entry | The Absolute Effect</title>
<style>
:root{--ink:#171717;--muted:#666660;--line:#deded8;--paper:#fff;--wash:#f5f5f1;--soft:#fafaf8}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}a{color:inherit}main{max-width:1080px;margin:0 auto;padding:28px 22px 70px}.back{display:inline-flex;text-decoration:none;font-size:14px;color:var(--muted);margin-bottom:38px}.hero{padding:0 0 28px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 13px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.04em;margin:0 0 16px}.question{font-size:20px;line-height:1.45;max-width:850px;margin:0;color:#30302d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:24px 0}.stat{background:var(--paper);padding:18px}.label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.value{font-size:15px;font-weight:650;line-height:1.4}.section{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;margin:18px 0}.section h2{font-size:21px;letter-spacing:-.02em;margin:0 0 18px}.section p{margin:10px 0}.effect-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.effect{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:22px}.effect .number{font-size:30px;font-weight:850;letter-spacing:-.03em}.effect .small{font-size:13px;color:var(--muted);margin-top:5px}.effect p{margin:13px 0 0;font-size:14px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.subcard{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:20px}.subcard h3{margin:0 0 10px;font-size:15px}.subcard p{font-size:14px;margin:7px 0}.interpretation{font-size:17px;line-height:1.6}.reference{padding:13px 0;border-top:1px solid var(--line);font-size:14px}.reference:first-child{border-top:0;padding-top:0}.primary{display:inline-block;margin-top:8px;text-decoration:none;font-weight:700}.note{font-size:13px;color:var(--muted)}.error{border-color:#c8a5a5}.error h1{margin-top:0}
@media(max-width:760px){main{padding:22px 16px 55px}.grid{grid-template-columns:1fr 1fr}.effect-grid,.two-col{grid-template-columns:1fr}.question{font-size:18px}.section{padding:21px}.hero h1{font-size:39px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.stat{padding:14px}}
</style>
</head>
<body><main>
<a class="back" href="./">← Back to The Absolute Effect</a>
<div id="app"><div class="section">Loading evidence…</div></div>
<script>
const SOURCES=['data/daily-evidence-2026-09-06.json','data/daily-evidence-2026-09-06-batch2.json','data/daily-evidence-2026-09-07.json','data/daily-evidence-2026-09-08.json','data/daily-evidence-2026-09-09-batch3.json'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(x){
 const rates=x.interventionRate!=null&&x.controlRate!=null?`${x.interventionRate}% vs ${x.controlRate}%`:'Not quantified';
 const abs=x.absoluteBenefit!=null?` (${x.absoluteBenefit>0?'+':''}${x.absoluteBenefit} pp)`:'';
 return {site:x.site||'',discipline:x.discipline||'',setting:x.setting||'',trial:x.trial||x.name||'',question:x.clinicalQuestion||x.question||'',population:x.population||'',intervention:x.intervention||x.treatment||'',comparator:x.comparator||'',endpoint:x.endpoint||'',horizon:x.horizon||'',benefit:x.benefitText||`${x.endpoint||'Outcome'}: ${rates}${abs}`,nnt:x.nnt||'Not appropriately calculable',harm:x.harmText||x.harmLabel||'Not quantified in the source entry',nnh:x.nnH||x.nnh||'Not appropriately calculable',relative:x.relativeEffect?(x.relativeLabel||'Relative effect')+': '+x.relativeEffect+(x.ci?' ('+x.ci+')':''):(x.relative||''),statistics:x.statistics||'',takeaway:x.clinicalInterpretation||x.takeaway||x.benefitText||'',refs:x.refs||[],url:(x.urls&&x.urls[0])||x.url||''};
}
async function load(){
 const id=new URLSearchParams(location.search).get('id');
 if(!id){showError('No evidence entry selected.');return}
 try{
   const results=await Promise.all(SOURCES.map(u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])));
   const raw=results.flat().find(x=>x.id===id);
   if(!raw){showError('The requested trial could not be found in the current evidence files.');return}
   render(normalize(raw));
 }catch(e){showError('The evidence entry could not be loaded. Please try again.');}
}
function showError(msg){document.getElementById('app').innerHTML=`<section class="section error"><h1>Evidence entry not found</h1><p>${esc(msg)}</p></section>`}
function render(x){
 document.title=x.trial+' | The Absolute Effect';
 const refs=(x.refs||[]).map(r=>`<div class="reference">${esc(r)}</div>`).join('');
 document.getElementById('app').innerHTML=`<header class="hero"><p class="eyebrow">${esc(x.site)} · ${esc(x.discipline)} · ${esc(x.setting)}</p><h1>${esc(x.trial)}</h1><p class="question">${esc(x.question)}</p></header><div class="grid"><div class="stat"><div class="label">Population</div><div class="value">${esc(x.population)}</div></div><div class="stat"><div class="label">Intervention</div><div class="value">${esc(x.intervention)}</div></div><div class="stat"><div class="label">Comparator</div><div class="value">${esc(x.comparator)}</div></div><div class="stat"><div class="label">Primary endpoint</div><div class="value">${esc(x.endpoint)}</div></div></div><section class="section"><h2>Absolute Effect</h2><div class="effect-grid"><div class="effect"><div class="label">Benefit</div><div class="number">${esc(x.benefit)}</div><div class="small">Time horizon: ${esc(x.horizon||'Not specified')}</div><p><strong>NNT:</strong> ${esc(x.nnt)}</p></div><div class="effect"><div class="label">Harm / treatment burden</div><div class="number">${esc(x.harm)}</div><div class="small">Reported endpoint or treatment burden</div><p><strong>NNH:</strong> ${esc(x.nnh)}</p></div></div></section><section class="section"><h2>What the trial actually showed</h2><div class="two-col"><div class="subcard"><h3>Relative effect and results</h3><p>${esc(x.relative)}</p><p class="note">${esc(x.statistics)}</p></div><div class="subcard"><h3>Clinical interpretation</h3><p>${esc(x.takeaway)}</p></div></div></section><section class="section"><h2>Clinical takeaway</h2><p class="interpretation">${esc(x.takeaway)}</p></section><section class="section"><h2>Primary publication</h2>${refs}${x.url?`<a class="primary" href="${esc(x.url)}" target="_blank" rel="noopener">Open primary publication / source →</a>`:''}</section>`;
}
load();
</script></main></body></html>
